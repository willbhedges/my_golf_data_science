<title>Veenker Memorial Wind Caddie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: a caddie's card — controls band on top, hole map with the aim drawn on it, then the 18-hole strip. */
:root{
  --paper:#eef2ec; --card:#ffffff; --ink:#173326; --muted:#5b6f63; --line:#cfd9d1;
  --accent:#e0a800; --accent-ink:#3b2c00; --tie:#8a6bd1; --driver:#1f6b45; --wood2:#2f6fa8; --wood4:#b0612a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1a14; --card:#16241c; --ink:#e6efe8; --muted:#9db3a6; --line:#2a3d32;
  --accent:#ffc928; --accent-ink:#2a2000; --tie:#b49cf0; --driver:#5cc48d; --wood2:#6fb0e8; --wood4:#e59a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1a14; --card:#16241c; --ink:#e6efe8; --muted:#9db3a6; --line:#2a3d32;
  --accent:#ffc928; --accent-ink:#2a2000; --tie:#b49cf0; --driver:#5cc48d; --wood2:#6fb0e8; --wood4:#e59a62; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.controls{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
@media (max-width:640px){.controls{grid-template-columns:1fr}}
.dial{width:150px;height:150px;touch-action:none;cursor:grab;justify-self:center}
.dial text{font-family:var(--display);font-weight:600;fill:var(--muted);font-size:13px}
.ctl{display:grid;gap:10px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:600 14px var(--display);letter-spacing:.04em;border:1px solid var(--line);background:transparent;color:var(--ink);
  border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=range]{flex:1;min-width:140px;accent-color:var(--ink)}
.windread{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.hole{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.hole{grid-template-columns:1fr}}
.mapbox{position:relative;border-radius:8px;overflow:hidden;background:var(--line)}
.mapbox img{display:block;width:100%;height:auto}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.info{display:grid;gap:12px;align-content:start;min-width:0}
.holehead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.holeno{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.play{font-family:var(--display);font-weight:700;font-size:46px;line-height:1;letter-spacing:.01em}
.pill{display:inline-block;font:600 12px var(--display);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;border:1px solid currentColor}
.pill.tie{color:var(--tie)} .pill.chg{color:var(--accent)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);font-size:14px}
th{font:600 12px var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
tr.best td{font-weight:600}
.note{color:var(--muted);font-size:14px;max-width:62ch}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 4px;text-align:center;cursor:pointer;color:var(--ink)}
.chip b{display:block;font:700 18px var(--display)}
.chip span{font:600 13px var(--display);letter-spacing:.03em}
.chip[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.c-Driver{color:var(--driver)} .c-2-wood{color:var(--wood2)} .c-4-wood{color:var(--wood4)} .c-iron{color:var(--muted)}
.foot{color:var(--muted);font-size:12.5px;max-width:80ch}
</style>

<div class="wrap">
  <header>
    <h1>Veenker Memorial Wind Caddie</h1>
    <div class="sub">Red tees · Driver 275/300 · 2-wood 265/280 · 4-wood 255/270 · club and aim re-solved for the wind you set</div>
  </header>

  <section class="panel controls" aria-label="Wind">
    <svg class="dial" id="dial" viewBox="-80 -80 160 160" role="slider" aria-label="Wind direction (from)" tabindex="0">
      <circle r="70" fill="none" stroke="var(--line)" stroke-width="2"/>
      <g id="ticks"></g>
      <text x="0" y="-55" text-anchor="middle">N</text><text x="57" y="5" text-anchor="middle">E</text>
      <text x="0" y="64" text-anchor="middle">S</text><text x="-57" y="5" text-anchor="middle">W</text>
      <g id="needle"><line x1="0" y1="-62" x2="0" y2="40" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
        <polygon points="0,52 -9,34 9,34" fill="var(--ink)"/><circle cx="0" cy="-62" r="7" fill="var(--accent)" stroke="var(--ink)" stroke-width="2"/></g>
    </svg>
    <div class="ctl">
      <div class="row"><span class="label">Wind source</span>
        <div class="seg" id="src"><button data-v="2026-10-17">Sat 10/17</button><button data-v="2026-10-18">Sun 10/18</button><button data-v="custom">Custom</button></div></div>
      <div class="row" id="hourRow"><span class="label">Tee time</span><input type="range" id="hour" min="7" max="18" step="1"><span id="hourLbl" class="windread"></span></div>
      <div class="row"><span class="label">Speed</span><input type="range" id="speed" min="0" max="25" step="1"><span id="speedLbl" class="windread"></span></div>
      <div class="windread" id="windLbl"></div>
      <div class="sub">Drag the dial to where the wind blows <b>from</b>. The yellow end of the needle points into the wind.</div>
    </div>
  </section>

  <section class="panel hole" aria-live="polite">
    <div class="mapbox"><img id="map" alt="Overhead view of the hole"><svg id="ov"></svg></div>
    <div class="info">
      <div class="holehead"><span class="holeno" id="hNo"></span><span class="label" id="hPar"></span><span id="hBadges"></span></div>
      <div><div class="label" id="playLbl">Play</div><div class="play" id="hPlay"></div><div class="sub" id="hAim"></div></div>
      <div id="hTable"></div>
      <div class="note" id="hNote"></div>
      <div class="row"><div class="seg"><button id="prev">◀ Prev</button><button id="next">Next ▶</button></div></div>
    </div>
  </section>

  <section class="panel"><div class="label" style="margin-bottom:8px">All holes in this wind</div><div class="strip" id="strip"></div></section>

  <p class="foot" id="foot"></p>
</div>

  document.getElementById("speedLbl").textContent = st.mph + " mph";
  document.getElementById("needle").setAttribute("transform", `rotate(${st.from + 180})`);
  const f = st.src !== "custom" ? forecastAt(st.src, st.hour) : null;
  document.getElementById("windLbl").textContent = st.mph < 1.5 ? "Calm" :
    `From the ${card(st.from)} (${Math.round(st.from)}°) at ${st.mph} mph` + (f ? ` · gusts ${Math.round(f.gust)} · ${Math.round(f.temp)}°F` : "");
}
/* controls */
document.getElementById("ticks").innerHTML = Array.from({length:16}, (_,i) => { const a = i*22.5*Math.PI/180, r0 = i%4 ? 66 : 62;
  return `<line x1="${Math.sin(a)*r0}" y1="${-Math.cos(a)*r0}" x2="${Math.sin(a)*70}" y2="${-Math.cos(a)*70}" stroke="var(--muted)" stroke-width="1.5"/>`; }).join("");
const dial = document.getElementById("dial");
function dialSet(ev){ const r = dial.getBoundingClientRect(); const x = ev.clientX - (r.left + r.width/2), y = ev.clientY - (r.top + r.height/2);
  /* the yellow end points INTO the wind, i.e. toward where it comes from */
  st.from = Math.round(((Math.atan2(x, -y)*180/Math.PI) + 360) % 360 / 5) * 5; st.src = "custom"; render(); }
let drag = false;
dial.addEventListener("pointerdown", e => { drag = true; dial.setPointerCapture(e.pointerId); dialSet(e); });
dial.addEventListener("pointermove", e => { if(drag) dialSet(e); });
dial.addEventListener("pointerup", () => drag = false);
dial.addEventListener("keydown", e => { if(e.key==="ArrowRight"||e.key==="ArrowUp"){ st.from = (st.from+15)%360; st.src="custom"; render(); e.preventDefault(); }
  if(e.key==="ArrowLeft"||e.key==="ArrowDown"){ st.from = (st.from+345)%360; st.src="custom"; render(); e.preventDefault(); } });
document.getElementById("speed").addEventListener("input", e => { st.mph = +e.target.value; st.src = "custom"; render(); });
document.getElementById("hour").addEventListener("input", e => { st.hour = +e.target.value; render(); });
document.querySelectorAll("#src button").forEach(b => b.addEventListener("click", () => { st.src = b.dataset.v; render(); }));
document.getElementById("strip").addEventListener("click", e => { const b = e.target.closest(".chip"); if(b){ st.idx = +b.dataset.i; render(); } });
document.getElementById("prev").addEventListener("click", () => { st.idx = (st.idx + D.holes.length - 1) % D.holes.length; render(); });
document.getElementById("next").addEventListener("click", () => { st.idx = (st.idx + 1) % D.holes.length; render(); });
document.getElementById("foot").textContent = D.foot;
render();
</script>
