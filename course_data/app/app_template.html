<style>

  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;

}

  --paper:#0f1a14; --card:#16241c; --ink:#e6efe8; --muted:#9db3a6; --line:#2a3d32; --soft:#1b2b22;
  --accent:#ffc928; --accent-ink:#2a2000; --tie:#b49cf0; --driver:#5cc48d; --wood2:#6fb0e8; --wood4:#e59a62;
  --ok:#5cc48d; --auto:#6fb0e8; --warn:#ffb74a; --warn-bg:#33270f; --red:#ff8a80; --red-bg:#3a1714; --map:#0b130e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1a14; --card:#16241c; --ink:#e6efe8; --muted:#9db3a6; --line:#2a3d32; --soft:#1b2b22;
  --accent:#ffc928; --accent-ink:#2a2000; --tie:#b49cf0; --driver:#5cc48d; --wood2:#6fb0e8; --wood4:#e59a62;
  --ok:#5cc48d; --auto:#6fb0e8; --warn:#ffb74a; --warn-bg:#33270f; --red:#ff8a80; --red-bg:#3a1714; --map:#0b130e; color-scheme:dark}

.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}

details.panel>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}

.dialrow{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
@media (max-width:440px){.dialrow{grid-template-columns:1fr}}

.foot{color:var(--muted);font-size:12.5px}
/* your game */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.btn{display:inline-flex;align-items:center}
table.pf td{padding:5px 4px}
table.pf input{width:100%;max-width:76px;font:600 16px var(--body);padding:6px 6px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);font-variant-numeric:tabular-nums}
textarea{width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);resize:vertical}
#pfOut td:first-child,table.pf td:first-child{white-space:nowrap}

.gamecard{display:grid;gap:4px;text-align:left;cursor:pointer;width:100%}
/* hole map (golfer confirm) */
.cmap svg{max-height:70vh}
.qcard h2{font-size:26px}

.tc-err{color:var(--red)} .tc-warn{color:var(--warn)}

#routeStrip .btn{white-space:nowrap}

<body>
<div class="app" id="app"></div>
<script>/*__ENGINE__*/</script>
<script>
const D = /*__DATA__*/null;
const CELLS = D.wind_axes.cells, SPEEDS = D.wind_axes.speeds, CI = {};
CELLS.forEach((c, i) => CI[c] = i);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SHORT = {"Driver":"D","2-wood":"2W","4-wood":"4W","Long iron":"LI","Mid iron":"MI"};
const cls = c => (c === "Driver" || c === "2-wood" || c === "4-wood") ? "c-" + c : "c-iron";
const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = d => COMPASS[Math.round(((d % 360) + 360) % 360 / 22.5) % 16];
const yds = (v, side) => Math.abs(v) < 1.5 ? "on the line" : `${Math.abs(v).toFixed(0)} yds ${v < 0 ? "left" : "right"}`;

/* ------------------------------------------------------------------ state (per-viewer convenience only) */
const st = {screen: "pick", course: null, q: "", set: {}, idx: {}, src: {}, hour: {}, view: "land",
            custom: {from: 180, mph: 10, temp: 65}, adj: {}, club: {}, answers: {}, wind_open: false, lie: "fairway", shot: {},
            confirm: {}, cfocus: {}, creturn: {}, cmore: {}, cskipcard: {}, ctyped: {}, cstep: null};
const KEY = "aimcaddie1";
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && typeof s === "object") Object.assign(st, s); } catch (e) {}
for (const k of ["set","idx","src","hour","adj","club","answers","shot","confirm","cfocus","creturn","cmore","cskipcard","ctyped"]) if (!st[k] || typeof st[k] !== "object") st[k] = {};
if (!st.custom) st.custom = {from: 180, mph: 10, temp: 65};
/* deep links: #c=<course>&t=<tee set>&h=<hole no> (also used by the tests) */
(function readHash(){
  const m = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  const c = m.get("c"); if (!c || !D.courses.some(x => x.id === c)) return;
  st.course = c; st.screen = m.get("h") ? "hole" : "tees";
  if (m.get("t")) st.set[c] = m.get("t");
  if (m.get("h")) { const C = D.courses.find(x => x.id === c); const i = C.holes.findIndex(H => String(H.no) === m.get("h")); if (i >= 0) st.idx[c] = i; }
  if (m.get("v")) st.view = m.get("v");
})();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
  try {
    const C = cur(); let h = "";
    if (C && st.screen !== "game") { h = "#c=" + C.id + "&t=" + encodeURIComponent(curSet(C)); if (st.screen === "hole") h += "&h=" + C.holes[holeIdx(C)].no + (st.view && st.view !== "land" ? "&v=" + st.view : ""); }
    history.replaceState(null, "", h || location.pathname + location.search);
  } catch (e) {}
}
const cur = () => D.courses.find(c => c.id === st.course) || null;
function curSet(C){ const s = st.set[C.id]; return C.tee_sets.some(t => t.name === s && t.computed !== "missing") ? s : C.default_tee; }
function holeIdx(C){ const i = st.idx[C.id] || 0; return i < C.holes.length ? i : 0; }

/* ------------------------------------------------------------------ your game: the player profile (golf_player/1)
   The golfer's bag (typed in) is the prior centre; launch-monitor / tee-shot CSVs shrink it the way
   course_data/personal/bayes.py does, in closed form: log width and carry are normal, a common part (shared by
   every club) plus a club part, with the v2 prior's sds. Kept in this browser only (localStorage). */
const PD = D.player.profile_defaults, PKEY = "aimcaddie_profile1", PCLUBS = Object.keys(PD.clubs), PREF = PD.reference_club;
const PLAN2P = {}; for (const k of PCLUBS) if (PD.clubs[k].plan) PLAN2P[PD.clubs[k].plan] = k;
function freshProfile(){ const c = {}; for (const k of PCLUBS) c[k] = {carry: PD.clubs[k].carry, total: PD.clubs[k].total, width95: PD.clubs[k].width95};
  return {clubs: c, prior: "v2", shots: {lm: [], course: []}, files: [], msg: ""}; }
function loadProfile(){
  const f = freshProfile();
  try { const s = JSON.parse(localStorage.getItem(PKEY) || "null");
    if (s && typeof s === "object" && s.clubs) {
      for (const k of PCLUBS) for (const q of ["carry", "total", "width95"]) { const v = +((s.clubs[k] || {})[q]); if (isFinite(v) && v > 0) f.clubs[k][q] = v; }
      if (s.prior === "generic") f.prior = "generic";
      if (s.shots && Array.isArray(s.shots.lm)) f.shots.lm = s.shots.lm.filter(r => r && isFinite(r.carry));
      if (s.shots && Array.isArray(s.shots.course)) f.shots.course = s.shots.course.filter(r => r && typeof r === "object");
      if (Array.isArray(s.files)) f.files = s.files.slice(-20);
    } } catch (e) {}
  return f;
}
let PF = loadProfile(), POST = null;
function saveProfile(){ try { localStorage.setItem(PKEY, JSON.stringify({clubs: PF.clubs, prior: PF.prior, shots: PF.shots, files: PF.files})); } catch (e) {} }

/* ---- closed-form posterior (the summary part of bayes.py; no importance sampling) */
const Z90 = 1.6449;
const ncdf = x => { const t = 1 / (1 + 0.2316419 * Math.abs(x)), d = 0.3989423 * Math.exp(-x * x / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; };
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const sdev = a => { const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / Math.max(1, a.length - 1)); };
const median = a => { const b = [...a].sort((x, y) => x - y), n = b.length; return n ? (n % 2 ? b[(n - 1) / 2] : (b[n / 2 - 1] + b[n / 2]) / 2) : NaN; };
/* lateral scale s (= width95 / 4) by maximum likelihood: normal around the club's bias, plus measurement noise
   (aim + GPS) on course, and penalty shots censored past the penalty line. Returns [log s, var of log s]. */
function latFit(lat, noise2, cens){
  if (lat.length < 3) return null;
  const b = mean(lat), ll = ls => { const s2 = Math.exp(2 * ls) + noise2, s = Math.sqrt(s2); let v = 0;
    for (const x of lat) v += -0.5 * (x - b) ** 2 / s2 - Math.log(s);
    for (const c of cens) { const hi = 1 - ncdf((c.beyond - b) / s), lo = ncdf((-c.beyond - b) / s);
      v += Math.log(Math.max(1e-12, c.side === "left" ? lo : c.side === "right" ? hi : lo + hi)); }
    return v; };
  let best = Math.log(2), bv = -Infinity;
  for (let ls = Math.log(2); ls <= Math.log(60); ls += 0.01) { const v = ll(ls); if (v > bv) { bv = v; best = ls; } }
  const h = 0.02, d2 = (ll(best + h) - 2 * bv + ll(best - h)) / (h * h);
  return [best, d2 < -1e-6 ? Math.min(0.5, -1 / d2) : 0.5, b];
}
/* hierarchical normal: club value = centre + common + own; common ~ N(0, sc^2), own ~ N(0, sk[k]^2).
   obs[k] = [mean offset, var]. Club k's common comes from the other clubs (no double counting). */
function shrink(keys, obs, sc, sk){
  const out = {};
  for (const k of keys) {
    let prec = 1 / (sc * sc), num = 0;
    for (const j of keys) if (j !== k && obs[j]) { const v = obs[j][1] + sk[j] ** 2; prec += 1 / v; num += obs[j][0] / v; }
    let m = num / prec, v = 1 / prec + sk[k] ** 2;
    if (obs[k]) { const p = 1 / v + 1 / obs[k][1]; m = (m / v + obs[k][0] / obs[k][1]) / p; v = 1 / p; }
    out[k] = [m, v];
  }
  return out;
}
function fitProfile(pf){
  const P = PD.prior, gen = pf.prior === "generic";
  const wsd = gen ? Math.log(100 / 82) / Z90 : P.w_logsd, csd = gen ? 10 : P.c_common_sd, ksd = gen ? 5 : P.c_club_sd;
  const lmW = {}, coW = {}, carryO = {}, n = {}, bias = {};
  for (const k of PCLUBS) {
    const S = pf.clubs[k], depth = 0.1 * S.carry * P.depth_mult / 4, roll = S.total - S.carry;
    const lm = pf.shots.lm.filter(r => r.club === k), co = pf.shots.course.filter(r => r.club === k);
    n[k] = {launch_monitor: lm.length, on_course: co.length};
    const cobs = [];
    if (lm.length) {                                     /* launch monitor: good strikes = carry >= 88 % of the median */
      const med = median(lm.map(r => r.carry)), good = lm.filter(r => r.carry >= 0.88 * med);
      const sess = new Set(good.map(r => r.session || "s0")).size, cs = good.length >= 5 ? sdev(good.map(r => r.carry)) : depth;
      cobs.push([mean(good.map(r => r.carry)) - S.carry, cs * cs / good.length + P.session_sd ** 2 / sess]);
      const f = latFit(good.filter(r => r.side != null && isFinite(r.side)).map(r => r.side), 0, []);
      if (f) { lmW[k] = [f[0] + Math.log(4 * P.f_median) - Math.log(S.width95), f[1]]; bias[k] = f[2]; }
    }
    if (co.length) {                                     /* on course: total + lateral off the intended line */
      const ok = co.filter(r => !r.censored && r.lateral != null && isFinite(r.lateral));
      const noise2 = ok.length ? mean(ok.map(r => (r.aim_sd ?? 6) ** 2 + (r.gps_sd ?? P.gps_sd) ** 2)) : 61;

  let plays = 0; for (const [i, w] of K) plays += w * S3.plays[i];

  const mod = windMod(W.mph), b = S3.boxes[String(mod)];
  return {rel, plays, mod, box: b, S3, play: b.play * plays / S3.center};
}
function pickFor(C, H){
  const T = teeSpot(C, H), W = windFor(C, H);
  if (T.V.kind === "tee") { const r = solveTee(C, H, T, W); return {txt: SHORT[r.pick] + (r.tie ? "≈" : ""), c: cls(r.pick)}; }
  return {txt: String(Math.round(solvePar3(C, H, T, W).play)), c: ""};
}

function aimMark(x, y){ const c = (w, col) => `<g stroke="${col}" stroke-width="${w}" fill="none"><line x1="${x-18}" y1="${y}" x2="${x+18}" y2="${y}"/><line x1="${x}" y1="${y-18}" x2="${x}" y2="${y+18}"/><circle cx="${x}" cy="${y}" r="7"/></g>`;
  return c(3.6, "#1a1a1a") + c(1.6, "#ffc928") + `<circle cx="${x}" cy="${y}" r="2.2" fill="#e5202a" stroke="#1a1a1a" stroke-width=".6"/>`; }
const TXT = `font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" stroke="rgba(0,0,0,.75)" stroke-width="3.5" paint-order="stroke" fill="#fff"`;
function teeMark(x, y, label, colour, vbw){
  const right = x < vbw - 120, tx = right ? x + 16 : x - 16;
  return `<rect x="${x-9}" y="${y-9}" width="18" height="18" rx="3" fill="${colour || "#111"}" stroke="#fff" stroke-width="2.5"/>
    <text x="${tx}" y="${y - 12}" ${TXT} font-size="17" text-anchor="${right ? "start" : "end"}">${esc(label.toUpperCase())}</text>`;
}
function windArrow(V, W, vb){
  const up = V.up ?? V.bearing, a = ((W.from + 180) - up) * Math.PI / 180, R = Math.max(26, vb[2] * 0.055);

  return `<g><circle cx="${cx}" cy="${cy}" r="${R}" fill="rgba(10,20,15,.6)"/>
    ${W.mph >= 1 ? `<line x1="${cx-dx}" y1="${cy-dy}" x2="${cx+dx}" y2="${cy+dy}" stroke="#fff" stroke-width="${R/7}" stroke-linecap="round"/><circle cx="${cx+dx}" cy="${cy+dy}" r="${R/5}" fill="#ffc928"/>` : ""}
    <text x="${cx}" y="${cy + R + 18}" ${TXT} font-size="${Math.max(15, R*0.55)}" text-anchor="middle">${W.mph < 1 ? "calm" : Math.round(W.mph) + " mph"}</text></g>`;
}

/* second shot: green close-up turned so the approach plays up; DECADE box for the lie and today's wind modifier */
const LIE = {fairway: "fairway", first_cut: "first cut", rough: "rough", sand: "sand", recovery: "trees", native: "long grass", water: "water", ob: "OB", green: "green"};
const pct = x => Math.round(x * 100) + "%";
const lies = o => Object.entries(o || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${LIE[k] || k} ${pct(v)}`).join(" · ");
function apronWords(txt){ const m = /^(\d+) short, ([+-]?\d+)$/.exec(txt); if (!m) return txt === "green" ? "the green box" : txt;
  const o = +m[2]; return `the apron ${m[1]} short${o ? `, ${Math.abs(o)} ${o < 0 ? "left" : "right"}` : ""}`; }
function renderAppr(C, H, T, W, r){
  const V = T.V, A = V.approach, k = T.key;
  const shots = A.shots, want = st.shot[k] || (A.par5 && A.par5.call === "go" && shots.some(s => s.id === "go") ? "go" : shots[shots.length - 1].id);
  const S = shots.find(s => s.id === want) || shots[0], lie = st.lie === "rough" ? "rough" : "fairway";
  const mod = windMod(W.mph), b = S.boxes[lie][String(mod)] || S.boxes[lie]["0"];
  const rel = ((W.from - S.bearing) % 360 + 360) % 360, K = corners(W.mph, rel);
  let ratio = 0; for (const [i, w] of K) ratio += w * S.plays_ratio[i];
  ratio = ratio / (1 + tempK(W));
  const plays = b.play * ratio, vb = [0, 0, A.w, A.h];
  const poly = (pts, a) => `<polygon points="${pts.map(q => q.join(",")).join(" ")}" ${a}/>`;
  let over = poly(A.green, `fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="5 4"`);
  if (S.apron) over += poly(S.apron.zone, `fill="rgba(255,201,40,.12)" stroke="#ffc928" stroke-width="1.4" stroke-dasharray="5 4"`) +
    `<circle cx="${S.apron.target[0]}" cy="${S.apron.target[1]}" r="5" fill="#ffc928" stroke="#1a1a1a" stroke-width="1.2"/>` +
    `<text x="${S.apron.target[0] + 9}" y="${S.apron.target[1] + 4}" ${TXT} font-size="13">APRON ${S.apron.L} SHORT</text>`;
  if (S.sg && S.sg.recommend === "sg" && S.sg.box.length) over += poly(S.sg.box, `fill="none" stroke="#c9a7ff" stroke-width="2" stroke-dasharray="4 3"`);
  /* going for it from beyond the green-box range: the target is the apron short of the green */
  const P5 = A.par5, lieKey = lie === "rough" ? "rough" : "fairway";
  const apron = S.id === "go" && S.apron && P5 && A.typical.median > P5.green_box_up_to[lieKey];
  const area = Math.abs(b.shape.reduce((a, q, i) => { const n = b.shape[(i + 1) % b.shape.length]; return a + q[0] * n[1] - n[0] * q[1]; }, 0)) / 2;
  over += poly(b.shape, `fill="rgba(37,208,255,${apron ? .2 : .42})" stroke="#25d0ff" stroke-width="2.2"`);
  if (area < 60) over += `<circle cx="${b.aim[0]}" cy="${b.aim[1]}" r="14" fill="rgba(37,208,255,${apron ? .2 : .45})" stroke="#25d0ff" stroke-width="2.2"/>`;
  over += apron ? aimMark(S.apron.target[0], S.apron.target[1]) : aimMark(b.aim[0], b.aim[1]);
  over += windArrow({up: A.up, bearing: S.bearing}, W, vb) +
    `<text x="${A.w / 2}" y="${A.h - 10}" ${TXT} font-size="14" text-anchor="middle">${S.id === "go" ? "FROM THE TEE BALL" : S.id === "third" ? "FROM THE LAY-UP" : "FROM THE TEE BALL"} · ${Math.round(S.dist)} YDS ↓</text>`;
  const map = `<image href="${C.images[A.image]}" x="0" y="0" width="${A.w}" height="${A.h}"/>` + over;
  const seg = (items, cur, attr) => `<div class="seg">${items.map(([v, l]) => `<button ${attr}="${v}" aria-pressed="${v === cur}">${esc(l)}</button>`).join("")}</div>`;
  const controls = `<div class="row">${shots.length > 1 ? seg(shots.map(s => [s.id, s.label]), S.id, "data-shot") : ""}${seg([["fairway", "From the fairway"], ["rough", "From the rough"]], lie, "data-lie")}</div>`;
  const haz = Object.entries(b.haz || {}).map(([side, h]) => `${LIE[h] || h} ${side}`).join(", ");
  const play = apron ? `<div class="label">Go for it: play it like</div>
    <div class="playrow"><span class="play">${Math.round(S.apron.shot * ratio)} yds</span><span class="sub" style="padding-bottom:5px">to the apron ${S.apron.L} short · ${Math.round(S.apron.shot)} calm${S.apron.club ? " · " + esc(S.apron.club) : ""}</span></div>`
    : `<div class="label">${S.id === "go" ? "Go for it: play it like" : S.id === "third" ? "Third shot: play it like" : "Approach: play it like"}</div>
    <div class="playrow"><span class="play">${Math.round(plays)} yds</span><span class="sub" style="padding-bottom:5px">box ${Math.round(b.lo)}–${Math.round(b.hi)} · ${Math.round(b.play)} calm${b.club ? " · " + esc(b.club) : ""}</span></div>`;
  let aim = apron ? `<p><b>Aim at the dot on the apron</b>, ${S.apron.L} yds short of the green centre${S.apron.off ? `, ${Math.abs(S.apron.off)} ${S.apron.off < 0 ? "left" : "right"}` : ""}: from your usual ${Math.round(A.typical.median)} yds the green box (faint blue) only pays inside ${P5.green_box_up_to[lieKey]} yds from the ${lie}. The ball runs up from there; the dashed yellow shape is where it finishes.</p>`
    : `<p><b>Land it in the blue box</b>: aim ${esc(b.aim_text || "centre")} of the green. DECADE cushions from the ${lie}${haz ? ` (trouble: ${esc(haz)})` : ""}; wind modifier ${mod > 0 ? "+" + mod : mod} yd on every edge. “Play it like” adds the wind along this shot's line and the temperature.</p>`;
  if (S.sg && S.sg.recommend === "sg" && S.sg.play) aim += `<p class="sub">Strokes-gained check (16 pins): aiming at the purple dashed area, ${Math.round(S.sg.play)} yds, is ${S.sg.cost ? (+S.sg.cost).toFixed(2) : "a little"} strokes better than the box.</p>`;
  const tp = A.typical, badges = [];
  let info = `<p>${S.id === "third" ? "" : `Your tee shot (${esc((A.tee || {}).club || r.pick)}) typically leaves <b>${Math.round(tp.median)} yds</b> (${Math.round(tp.p10)}–${Math.round(tp.p90)})${tp.club ? `, about a ${esc(tp.club)}` : ""}. It finishes: ${esc(lies(tp.lies))}.`}</p>`;
  if (A.par5) { const P5 = A.par5, L = P5.layup;
    badges.push(`<span class="pill ${P5.call === "go" ? "ans" : "chg"}">The call: ${P5.call === "go" ? "go for it" : "lay up"} (${pct(P5.p_go)} of tee balls go)</span>`);
    info += `<div class="conf auto"><b>Go or lay up?</b>
      <div>Go when you have <b>${P5.go_up_to.fairway}</b> or less from the fairway, ${P5.go_up_to.first_cut ?? P5.go_up_to.fairway} from the first cut, ${P5.go_up_to.rough} from the rough. Aim at the green box only inside ${P5.green_box_up_to.fairway} (fairway) / ${P5.green_box_up_to.rough} (rough); beyond that, aim at ${esc(P5.go_aims.filter(a => a[0] !== "green").map(a => apronWords(a[0])).slice(0, 2).join(" or ") || "the apron")}.</div>
      ${P5.margin ? `<div>Going beats laying up by <b>${Math.abs(P5.margin.mean).toFixed(2)} strokes</b> when it is in range.</div>` : ""}
      <div>Lay-up: <b>${L.L} yds short of the green centre${L.off ? `, ${Math.abs(L.off)} ${L.off < 0 ? "left" : "right"}` : ""}</b>${L.club ? ` (${esc(L.club)}, ${Math.round(L.shot)} yds)` : ""}; it finishes ${esc(lies(L.lies))}.${L.full_wedge_cost ? ` Leaving a full wedge (${L.full_wedge_L}) instead costs +${(+L.full_wedge_cost).toFixed(2)}.` : ""}</div></div>`;
  }
  if (T.back !== 0 || (T.t && T.t.back !== 0)) info += `<p class="sub">Second-shot numbers are for the ${A.black ? "Black" : "Gold"}-tee plan; from your tee the approach is about ${Math.abs(T.back)} yds ${T.back > 0 ? "longer" : "shorter"}.</p>`;

        <line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#ffc928" stroke-width="4"/>
        <circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="7" fill="#fff" stroke="#111" stroke-width="2.5"/>
        <circle cx="${b[0].toFixed(1)}" cy="${b[1].toFixed(1)}" r="9" fill="#ffc928" stroke="#111" stroke-width="2.5"/>

function confirmClick(C, b){
  const S = sess(C), d = b.dataset;
  if (d.cans) { const q = nextQuestion(C, S); if (!q) return;
    S.act({question: q.id, kind: "confirm", ref: q.ref, answer: d.cans});
    if (st.cfocus[C.id] === q.id) delete st.cfocus[C.id];
    saveSess(C); return true; }
  if (d.cstep) { st.cstep = null; return true; }
  if (d.cundo) { S.undoLast(); st.cstep = null; delete st.cfocus[C.id]; saveSess(C); return true; }
  if (d.cskip) { st.cmore[C.id] = false; st.cstep = null; delete st.cfocus[C.id]; st.screen = "hole"; saveSess(C); return true; }
  if (d.cmore) { st.cmore[C.id] = true; return true; }

  if (d.tc === "use") { const T = st.ctyped[C.id] = Object.assign({unit: "yd"}, st.ctyped[C.id] || {}, readTyped());
    const [card, iss] = TypedCard.parseTypedCard(T.yards, {pars: T.pars, unit: T.unit, tee: "Typed"});
    T.issues = iss;
    if (card && card.tee_sets.Typed.yards.length !== S.n) { T.issues = iss.concat([{level: "error", code: "count", msg: `${card.tee_sets.Typed.yards.length} holes typed; this course has ${S.n}`}]); return true; }
    if (card) { useCard(C, card); T.resolved = sess(C).pool !== C.confirm.pool; delete st.cskipcard[C.id]; saveSess(C); }
    return true; }
  if (d.tc === "clear") { useCard(C, null); st.ctyped[C.id] = {yards: "", pars: "", unit: "yd"}; saveSess(C); return true; }
  if (d.tc === "skip") { st.cskipcard[C.id] = true; return true; }

function readTyped(){ const y = $("tcYards"), p = $("tcPars"); const o = {}; if (y) o.yards = y.value; if (p) o.pars = p.value; return o; }
function confirmTap(C, ev){
  const S = sess(C), svg = $("cmap"); if (!S || !svg) return;

  const m = svg.getScreenCTM(); if (!m) return;                   /* screen -> image px (viewBox, letterboxing included) */

  const ip = sp.matrixTransform(m.inverse()), px = [ip.x, ip.y];

    </section>
    <section class="panel stack" id="pfOut">${gameOut()}</section>
    <p class="foot">The fit is the closed-form summary of course_data/personal/bayes.py (golf_player/1): log pattern width and carry are normal, one part shared by every club and one per club, centred on what you typed. Mishits (carry under 88% of the club's median) are left out of the width; penalty tee shots count as balls past the penalty line.</p>`;
}

/* ------------------------------------------------------------------ render + events */
function render(){
  const C = cur(); if (!C && st.screen !== "game") st.screen = "pick";
  const app = $("app");
  if (st.screen === "confirm" && !(C && C.confirm)) st.screen = "hole";
  app.innerHTML = st.screen === "game" ? renderGame() : st.screen === "pick" ? renderPick() : st.screen === "tees" ? renderTees() : st.screen === "confirm" ? renderConfirm() : renderHole();
  document.title = st.screen === "pick" ? "Aim Caddie" : st.screen === "game" ? "Your game · Aim Caddie" : st.screen === "confirm" ? `Hole map · ${cur().short}` : `${cur().short} · Aim Caddie`;
  save();
}
function rerenderKeepFocus(id){ const y = window.scrollY; render(); if (id && $(id)) { const el = $(id); el.focus(); if (el.type === "search" || el.type === "text") { const n = el.value.length; el.setSelectionRange(n, n); } } window.scrollTo(0, y); }
const app = $("app");
app.addEventListener("input", e => {
  const C = cur(), t = e.target;
  if (t.id === "q") { st.q = t.value; rerenderKeepFocus("q"); return; }
  if (!C) return;
  if (t.id === "hourT") { st.hour[C.id] = +t.value; rerenderKeepFocus("hourT"); }
  else if (t.id === "mph" || t.id === "temp") { const H = C.holes[holeIdx(C)], W = windFor(C, H);
    st.custom = {from: Math.round(W.from), mph: t.id === "mph" ? +t.value : Math.round(W.mph), temp: t.id === "temp" ? +t.value : Math.round(W.temp ?? 70)};
    st.src[C.id] = "custom"; st.wind_open = true; rerenderKeepFocus(t.id); }
  else if (t.id === "adj") { const H = C.holes[holeIdx(C)]; st.adj[C.id + "|" + H.no] = +t.value; rerenderKeepFocus("adj"); }
});
app.addEventListener("click", e => {
  const C = cur(), b = e.target.closest("button, tr[data-club], summary");
  if (!b && C && e.target.closest && e.target.closest("#cmap")) return confirmTap(C, e);
  if (!b) return;
  if (b.tagName === "SUMMARY") { if (b.parentElement.id === "windPanel") setTimeout(() => { st.wind_open = b.parentElement.open; save(); }, 0); return; }
  const d = b.dataset;
  if (d.course) { st.course = d.course; st.screen = "tees"; window.scrollTo(0, 0); return render(); }
  if (d.go) { if (d.go === "game" && st.screen !== "game") st.game_back = st.screen;
    if (d.go === "confirm" && C) st.creturn[C.id] = st.screen === "hole" ? "hole" : "tees";
    st.screen = d.go; window.scrollTo(0, 0); return render(); }
  if (d.pfprior) { PF.prior = d.pfprior; profileChanged(); return rerenderKeepFocus(); }
  if (d.pfact) { if (d.pfact === "clear") { PF.shots = {lm: [], course: []}; PF.files = []; PF.msg = "Removed all shots."; }
    else if (d.pfact === "reset") { const f = freshProfile(); PF.clubs = f.clubs; PF.prior = "v2"; PF.msg = "Bag reset to the defaults."; }
    else if (d.pfact === "paste") { const t = ($("pfPaste") || {}).value || ""; if (t.trim()) importCsv("pasted CSV", t); else PF.msg = "Paste a CSV first."; }
    profileChanged(); return rerenderKeepFocus(); }
  if (!C) return;
  if (C.confirm && confirmClick(C, b)) { if (st.screen === "hole") window.scrollTo(0, 0); return render(); }
  if (d.set) { st.set[C.id] = d.set; return render(); }
  if (d.src) { st.src[C.id] = d.src; if (d.src === "custom") { const W = windFor(C, C.holes[holeIdx(C)]); st.custom = {from: Math.round(W.from), mph: Math.round(W.mph), temp: Math.round(W.temp ?? 70)}; } return render(); }
  if (d.card) { const A = st.answers[C.id] = st.answers[C.id] || {}; if (A[d.card] === d.ans) delete A[d.card]; else A[d.card] = d.ans; return rerenderKeepFocus(); }
  if (d.view) { st.view = d.view; return render(); }
  if (d.lie) { st.lie = d.lie; return render(); }
  if (d.shot) { const H = C.holes[holeIdx(C)]; st.shot[C.id + "|" + H.no] = d.shot; return render(); }
  if (d.i !== undefined) { st.idx[C.id] = +d.i; return render(); }
  if (b.id === "prev" || b.id === "next") { const n = C.holes.length; st.idx[C.id] = (holeIdx(C) + (b.id === "next" ? 1 : n - 1)) % n; return render(); }
  if (d.club) { const H = C.holes[holeIdx(C)], T = teeSpot(C, H), r = solveTee(C, H, T, windFor(C, H)), ck = T.key + "|" + T.name;
    if (d.club === r.pick) delete st.club[ck]; else st.club[ck] = d.club; return rerenderKeepFocus(); }
});
/* your game: typed numbers apply on change (not per keystroke); files are read in the browser, never uploaded */
app.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.pf) { const [k, q] = t.dataset.pf.split("|"), v = +t.value, lo = +t.min, hi = +t.max;
    if (PF.clubs[k] && isFinite(v) && v >= lo && v <= hi) { PF.clubs[k][q] = v; if (q === "carry" && PF.clubs[k].total < v) PF.clubs[k].total = v; PF.msg = ""; }
    else { PF.msg = `${k} ${q === "width95" ? "pattern" : q}: enter ${lo}–${hi} yds.`; t.value = Math.round(PF.clubs[k][q]); }
    profileChanged(); const o = $("pfOut"), m = $("pfMsg"); if (o) o.innerHTML = gameOut(); if (m) m.textContent = PF.msg; return; }
  if (t.id === "pfFile" && t.files && t.files[0]) { const f = t.files[0];
    if (f.size > 5e6) { PF.msg = `${f.name} is over 5 MB.`; return rerenderKeepFocus(); }
    const rd = new FileReader();
    rd.onload = () => { importCsv(f.name, String(rd.result || "")); profileChanged(); rerenderKeepFocus(); };
    rd.onerror = () => { PF.msg = `Could not read ${f.name}.`; rerenderKeepFocus(); };
    rd.readAsText(f); }
});
/* wind dial: drag to where the wind blows from */
let drag = false;
function dialSet(ev){ const C = cur(), dl = $("dial"); if (!C || !dl) return; const r = dl.getBoundingClientRect();
  const x = ev.clientX - (r.left + r.width / 2), y = ev.clientY - (r.top + r.height / 2), W = windFor(C, C.holes[holeIdx(C)]);
  st.custom = {from: Math.round(((Math.atan2(x, -y) * 180 / Math.PI) + 360) % 360 / 5) * 5, mph: Math.round(W.mph), temp: Math.round(W.temp ?? 70)};
  st.src[C.id] = "custom"; st.wind_open = true; render(); }
app.addEventListener("pointerdown", e => { if (e.target.closest("#dial")) { drag = true; dialSet(e); e.preventDefault(); } });
window.addEventListener("pointermove", e => { if (drag) dialSet(e); });
window.addEventListener("pointerup", () => { drag = false; });
app.addEventListener("keydown", e => {
  if (!e.target.closest || !e.target.closest("#dial")) return;
  const C = cur(), W = windFor(C, C.holes[holeIdx(C)]), k = {ArrowRight: 15, ArrowUp: 15, ArrowLeft: -15, ArrowDown: -15}[e.key];
  if (!k) return; e.preventDefault();
  st.custom = {from: (Math.round(W.from) + k + 360) % 360, mph: Math.round(W.mph), temp: Math.round(W.temp ?? 70)}; st.src[C.id] = "custom"; st.wind_open = true;
  render(); $("dial") && $("dial").focus();
});
render();
</script>
</body>
