    style = "style='color: #4c7523'";
    } %>
    <td class="total" <%=style%>><%-accounting.formatMoney(amount, BILLING_CURRENCY_FORMAT)%></td>
    <td class="actions">
        <div class="btn-group">

                <span class="caret"></span>
            </button>
            <ul class="dropdown-menu  table-actions-menu">
                <li><a href="#" class="print"><i class="fa fa-print" aria-hidden="true"></i>Print</a></li>
                <li><a href="#" class="email"><i class="fa fa-paper-plane" aria-hidden="true"></i>Email</a></li>
            </ul>
        </div>
    </td>
</script>

<script type="text/html" id="template_account_history">
    <h2>Member Balance Transactions</h2>
    <div class="row">
        <% if(member == 1){ %>
        <div class="col-md-3">
            <div class="panel <% if(member_account_balance < 0){ print('panel-danger') }else{ print('panel-default') } %>">
                <div class="panel-heading"><% if(App.data.course.get('member_balance_nickname')) { print(App.data.course.get('member_balance_nickname')) }else{ print('Member Balance') } %></div>
                <div class="panel-body <% if(member_account_balance < 0){ print('bg-danger') } %>"><h4><%-accounting.formatMoney(member_account_balance)%></h4></div>
            </div>
        </div>
        <% } %>
        <div class="col-md-3">
            <%
            var invoice_total_due = 0;
            if(invoice_balance <= 0){
            invoice_total_due = invoice_balance;
            }

            var invoice_credit;
            if(invoice_balance > 0){
            invoice_credit = invoice_balance;
            } %>
            <div class="panel <% if(invoice_balance < 0){ print('panel-danger') }else{ print('panel-default') } %>">
                <div class="panel-heading">Invoices Due</div>
                <div class="panel-body <% if(invoice_balance < 0){ print('bg-danger') } %>" <% if(invoice_credit > 0){ print('style="padding-bottom: 0px;"') } %>>
                    <h4 style="margin-bottom: 0px"><%-accounting.formatMoney(invoice_total_due)%></h4>
                    <% if(invoice_credit > 0){%><h5 style="margin-top: 2px;">(<%-accounting.formatMoney(invoice_credit)%>) Credit</h5><%}%>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="panel <% if(account_balance < 0){ print('panel-danger') }else{ print('panel-default') } %>">
                <div class="panel-heading"><% if(App.data.course.get('customer_credit_nickname')) { print(App.data.course.get('customer_credit_nickname')) }else{ print('Customer Credit') } %></div>
                <div class="panel-body <% if(account_balance < 0){ print('bg-danger') } %>"><h4><%-accounting.formatMoney(account_balance)%></h4></div>
            </div>
        </div>
        <% if(use_loyalty == 1){ %>
        <div class="col-md-3">
            <div class="panel panel-default">
                <div class="panel-heading">Loyalty Points</div>
                <div class="panel-body"><h4><%-loyalty_points%></h4></div>
            </div>
        </div>
        <% } %>
    </div>
    <div class="row">
        <div class="col-md-3 form-group">
            <label>Period</label>
            <%=_.dropdown({
            'custom': 'Custom Range',
            'today': 'Today',
            'yesterday': 'Yesterday',
            'last_week': 'Past Week',
            'last_2_weeks': 'Past 2 Weeks',
            'last_month': 'Past Month',
            'last_6_months': 'Past 6 Months',
            'last_year': 'Past Year'
            }, {
            'id': 'transaction-period',
            'class': 'form-control'
            }) %>
        </div>
        <div class="col-md-3 form-group">
            <label aria-labelledby="transactions-start">Start Date</label>
            <input type="text" id="transactions-start" placeholder="MM/DD/YYYY" class="datepicker form-control">
        </div>
        <div class="col-md-3 form-group">
            <label aria-labelledby="transactions-end">End Date</label>
            <input aria-labelledby="transactions-end" type="text" id="transactions-end" placeholder="MM/DD/YYYY" class="datepicker form-control">
        </div>
        <div class="col-md-3 form-group">
            <label aria-labelledby="filter-transactions" class="hidden-xs hidden-sm visible-md visible-lg">&nbsp;</label>
            <button aria-labelledby="filter-transactions" data-loading-text="Filtering..." id="filter-transactions" class="btn btn-primary pull-right">Apply Filter</button>
        </div>
    </div>
    <div id="account-transactions" class="table-responsive"></div>
</script>

<script type="text/html" id="template_account_pay_balance">
    <div class="modal-content billing-make-payment">
        <div class="modal-header">
            <button type="button" class="close text-muted" data-dismiss="modal" aria-hidden="true">&times;</button>
            <% if(App.data.course.get('onlineBillingPaymentsEnabled') && (App.data.course.get('has_card_processor') || App.data.user.get('dwolla_customer_id'))){ %>
            <h4 class="modal-title">Make a Payment</h4>
            <% } %>
        </div>
        <div class="modal-body">
            <form role="form" id="pay_account_balance_form">
                <div id="account-balance-payment-error" class="alert alert-danger" style="display: none;"></div>
                <div class="row payment-amount-options">
                    <% if(current_balance > 0){ %>
                    <div class="col-md-4">
                        <input type="radio" name="payment_selection" value="current" class="payment-select" id="payment-current" <% if(selection == 'current'){ %>checked="checked"<% } %>>
                        <label class="payment-amount-container" for="payment-current">
                            <strong class="field-label">Current Balance</strong>
                            <span class="payment-amount"><%-accounting.formatMoney(current_balance)%></span>
                        </label>
                    </div>
                    <% } %>
                    <% if(statement_balance > 0){ %>
                    <div class="col-md-4">
                        <input type="radio" name="payment_selection" value="statement" class="payment-select" id="payment-statement" <% if(selection == 'statement'){ %>checked="checked"<% } %>>
                        <label class="payment-amount-container" for="payment-statement">
                            <strong class="field-label">Statement Balance</strong>
                            <span class="payment-amount"><%-accounting.formatMoney(statement_balance) %></span>
                        </label>
                    </div>
                    <% } %>
                    <div class="col-md-4">
                        <input aria-labelledby="payment-other" type="radio" name="payment_selection" value="other" class="payment-select" id="payment-other" <% if(selection == 'other'){ %>checked="checked"<% } %>>
                        <label aria-labelledby="other-payment-amount" class="payment-amount-container" for="payment-other">
                            <strong class="field-label">Other Amount</strong>
                            <input aria-labelledby="other-payment-amount" type="text" name="other_payment_amount" id="other-payment-amount" class="form-control other-amount" placeholder="0.00"
                                   value="<% if(selection == 'other' && other_amount > 0){ %><%-accounting.formatMoney(other_amount, '')%><% } %>"
                            >
                        </label>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-8">
                        <label class="field-label">Payment Method</label>
                        <select id="account_payment_method" class="form-control payment-methods">
                            <% if(!payment_methods || payment_methods.length == 0){ %>
                            <option value="">No valid payment methods available</option>
                            <% }else{ %>
                            <option value="">- Select Payment Method -</option>
                            <% _.each(payment_methods.models, function(payment_method){
                            let verified = true;
                            if(payment_method.get('is_dwolla') == 1 && payment_method.get('is_verified') == 0){
                                verified = false;
                            }
                            %>
                            <option <%if(!verified){ %>disabled<% } %> value="<%-payment_method.get('credit_card_id')%>" <% if(payment_method.get('credit_card_id') == credit_card_id){ %>selected<%}%>>
                            <% if(!verified){ %>(UNVERIFIED)<% } %>
                            <%-payment_method.getDescription()%>
                            </option>
                            <% }); %>
                            <% } %>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="field-label">Payment Date</label>
                        <span class="payment-date"><%-moment().format('MM/DD/YY')%></span>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12 text-danger payment-fee-warning" id="payment-fee-note"></div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <div class="row">
                <div class="col-md-12">
                    <button class="btn btn-success review pull-left">Review Payment</button>
                    <button class="btn btn-success pay pull-left" style="display: none" data-loading-text="Applying Payment...">Complete Payment</button>
                    <button class="btn btn-default back pull-left" style="display: none">Back</button>
                    <button class="btn btn-default cancel pull-left" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary confirm" style="display: none" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/html" id="template_account_pay_balance_review">
    <div id="account-balance-payment-error" class="alert alert-danger" style="display: none;"></div>
    <div class="row">
        <div class="col-md-12">
            <table class="payment-review">
                <tbody>
                    <tr>
                        <th>Method</th>
                        <td><%-selected_payment_method.getDescription()%></td>
                    </tr>
                    <tr>
                        <th>Date</th>
                        <td><%-moment().format('MM/DD/YY')%></td>
                    </tr>
                    <tr>
                        <th>Amount</th>
                        <td><%-accounting.formatMoney(payment_amount)%></td>
                    </tr>
                    <% if(fee_amount > 0){ %>
                    <tr class="fee">
                        <th>Convenience Fee</th>
                        <td><%-accounting.formatMoney(fee_amount)%></td>
                    </tr>
                    <tr>
                        <th>Total Payment</th>
                        <td><%-accounting.formatMoney(total)%></td>
                    </tr>
                    <% } %>
                </tbody>
            </table>
        </div>
    </div>
    <%
    var autopayCreditCardId = user.get('autopay_credit_card_id');
    var paymentExists = _.find(user.get('credit_cards').models, function(creditCard){
        return creditCard.id == autopayCreditCardId
    });

    if(
        selected_payment_method.get('card_type') == 'Bank Acct' &&
        user.get('billing').autopay_enabled &&
        (!autopayCreditCardId || !paymentExists)
    ){ %>
    <div class="row">
        <div class="col-md-12">
            <label class="autopay-setting">
                <input type="checkbox" name="autopay_enable" value="1" checked>
                <strong>Automatically pay future statements using <%-selected_payment_method.getDescription()%></strong>
                <p class="text-muted">Avoid unnecessary late payment fees by using our auto pay feature. Statement balance will be paid
                    automatically <em>5 days</em> after the statement has generated.</p>
            </label>
        </div>
    </div>
    <% } %>
</script>

<script type="text/html" id="template_account_overview">
    <h2 style="margin-bottom: 25px;">Account Overview</h2>
    <div class="row">
        <div class="col-md-6">
            <%
            var totalBalance = 0 - (parseFloat(invoice_balance) + parseFloat(member_account_balance));
            %>
            <div class="panel panel-default">
                <div class="panel-heading">Current Balance</div>
                <div class="panel-body" style="height: 80px;">
                    <div class="pull-left" style="width: 48%">
                        <h3 style="margin-bottom: 0px; margin-top: 5px"><%-accounting.formatMoney(totalBalance, BILLING_CURRENCY_FORMAT)%></h3>
                        <% if(totalBalance < 0){ %>
                        <h5 style="margin-top: 2px;"><em>Credit</em></h5>
                        <% } %>
                    </div>
                    <div class="pull-right" style="width: 48%">
                        <% if(App.data.course.get('onlineBillingPaymentsEnabled') && (App.data.course.get('has_card_processor') || App.data.user.get('dwolla_customer_id'))){ %>
                        <button class="btn btn-success pull-right pay-balance">Make a Payment</button>
                        <% } %>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="panel panel-default">
                <div class="panel-heading"><% if(App.data.course.get('customer_credit_nickname')) { print(App.data.course.get('customer_credit_nickname')) }else{ print('Customer Credit') } %></div>
                <div class="panel-body" style="height: 80px;">
                    <h3 style="margin-top: 5px"><%-accounting.formatMoney(0 - account_balance, BILLING_CURRENCY_FORMAT)%></h3>
                </div>
            </div>
        </div>
        <% if(use_loyalty == 1){ %>
        <div class="col-md-3">
            <div class="panel panel-default">
                <div class="panel-heading">Loyalty Points</div>
                <div class="panel-body" style="height: 80px;">
                    <h3 style="margin-top: 5px"><%-loyalty_points%></h3>
                </div>
            </div>
        </div>
        <% } %>
    </div>
    <div class="row">
        <div class="col-md-12">
            <h3>Transactions</h3>
            <hr style="margin-top: 0px; margin-bottom: 0px;">
        </div>
    </div>
    <div class="row" id="account-transactions"></div>
</script>

<script type="text/html" id="template_account_payments">
    <h2 style="margin-bottom: 25px;">Payment History</h2>
    <div class="row" id="payment-transactions"></div>
</script>

<script type="text/html" id="template_invoice_details">
    <div class="modal-content invoice-details">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
            <h4 class="modal-title">
                Invoice #<%-invoice_number%>
                <% if(_.round(total - paid) <= 0){ %>
                <span class="label label-success">PAID</span>
                <% }else if(moment(due_date).startOf('day').unix() < moment().startOf('day').unix()){ %>
                <span class="label label-danger">OVERDUE</span>
                <% }else{ %>
                <span class="label label-warning">UNPAID</span>
                <% } %>
            </h4>
        </div>
        <div class="modal-body container-fluid">
            <div class="row">
                <div class="col-md-4" style="margin-bottom: 1em;">
                    <h4 style="margin-top: 0px;">To</h4>
                    <%-person_info.first_name%> <%-person_info.last_name%>
                </div>
                <div class="col-md-4" style="margin-bottom: 1em;">
                    <h4 style="margin-top: 0px;">From</h4>
                    <%-course_info.name%>
                    <%-course_info.phone%>
                </div>
                <div class="col-md-4 dates" style="margin-bottom: 1em;">
                    <% if(_.round(total - paid) > 0){ %>
                    <span class="line">
                    <button class="btn btn-success pay" style="float: right; margin-bottom: 10px;">Pay Online</button>
                </span>
                    <% } %>
                    <span class="line">
                    <label>Invoiced</label> <span class="date"><%-moment(date).format('MM/DD/YYYY') %></span>
                </span>
                    <span class="line">
                    <label>Due On</label> <span class="date"><%-moment(due_date).format('MM/DD/YYYY') %></span>
                </span>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                            <tr>
                                <th class="name">Item</th>
                                <th class="qty">Qty</th>
                                <th class="price">Price</th>
                            </tr>
                            </thead>
                            <tbody>
                            <% _.each(current_items, function(item){ %>
                            <tr>
                                <td class="name"><%-item.name%></td>
                                <td class="qty"><%-item.quantity%></td>
                                <td class="price"><%-accounting.formatMoney(item.total)%></td>
                            </tr>
                            <% }); %>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="col-md-offset-6 col-md-6">
                    <table class="table totals">
                        <tbody>
                        <tr>
                            <th>Total</th>
                            <td><%-accounting.formatMoney(total)%></td>
                        </tr>
                        <tr>
                            <th>Paid</th>
                            <td><%-accounting.formatMoney(paid)%></td>
                        </tr>
                        <tr>
                            <th>Due</th>
                            <td><strong><%-accounting.formatMoney(total - paid)%></strong></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <% if(show_account_transactions == 1){ %>
            <% if(pay_member_account == 1){ %>
            <div class="row">
                <div class="col-md-12">
                    <h4><%=member_nickname%> Transactions</h4>
                    <table class="table transactions">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th class="date">Date</th>
                            <th class="name">Item</th>
                            <th class="price">Amount</th>
                        </tr>
                        </thead>
                        <tbody>
                        <% if(account_transactions.member.length > 0){
                        _.each(account_transactions.member, function(transaction){ %>
                        <tr>
                            <td><%-transaction.trans_comment %></td>
                            <td><%-transaction.date %></td>
                            <td><%=transaction.trans_description %></td>
                            <td><%-accounting.formatMoney(transaction.total)%></td>
                        </tr>
                        <% }); }else{ %>
                        <tr>
                            <td colspan="4"><span class="muted">No transactions available</span></td>
                        </tr>
                        <% } %>
                        </tbody>
                    </table>
                </div>
            </div>
            <% } %>
            <% if(pay_customer_account == 1){ %>
            <div class="row">
                <div class="col-md-12">
                    <h4><%=customer_credit_nickname%> Transactions</h4>
                    <table class="table transactions">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th class="date">Date</th>
                            <th class="name">Item</th>
                            <th class="price">Amount</th>
                        </tr>
                        </thead>
                        <tbody>
                        <% if(account_transactions.customer.length > 0){
                        _.each(account_transactions.customer, function(transaction){ %>
                        <tr>
                            <td><%-transaction.trans_comment %></td>
                            <td><%-transaction.date %></td>
                            <td><%=transaction.trans_description %></td>
                            <td><%-accounting.formatMoney(transaction.total)%></td>
                        </tr>
                        <% }); }else{ %>
                        <tr>
                            <td colspan="4"><span class="muted">No transactions available</span></td>
                        </tr>
                        <% } %>
                        </tbody>
                    </table>
                </div>
            </div>
            <% } %>
            <% } %>
            <div class="row">
                <div class="col-md-12">
                    <button class="btn btn-default close-invoice" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/html" id="template_confirmation">
    <h1 style="font-weight: bold; text-align: center;">Congratulations!</h1>
    <h3 style="margin-top: 0px; text-align: center;">Your reservation has been booked</h3>
    <div class="panel panel-default confirmation" style="margin-top: 15px;">
        <div class="panel-heading">
            <h3 class="panel-title">Reservation Details</h3>
        </div>
        <div class="panel-body">
            <div class="row">
                <div class="col-md-12">
                    <h4><%-course_name%> - <%-teesheet_title%></h4>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="well">
                        <div class="row">
                            <div class="col-xs-6 col-md-6">
                                <label>Date</label>
                                <span class="field"><%-moment(time).format('MMM Do')%></span>
                            </div>
                            <div class="col-xs-6 col-md-6">
                                <label>Time</label>
                                <span class="field"><%-moment(time).format('h:mma')%></span>
                            </div>
                        </div>
                        <div class="row">
                            <% if (!FACILITY_SETTINGS.hidePlayerCount && !Feature.isActive('2024-09-22-phoenix-tbr')) { %>
                            <div class="col-xs-6 col-md-6">
                                <label>Players</label>
                                <span class="field"><%-player_count%></span>
                            </div>
                            <% } %>
                            <% if (!FACILITY_SETTINGS.hideHolesCount && !Feature.isActive('2024-09-22-phoenix-tbr')) { %>
                            <div class="col-xs-6 col-md-6">
                                <label>Holes</label>
                                <span class="field"><%-holes%></span>
                            </div>
                            <% } %>
                        </div>
                        <% if(!hide_prices){ %>
                        <div class="row">
                            <% if(promo_discount > 0){ %>
                            <div class="col-xs-6 col-md-6">
                                <div class="row">
                                    <div class="col-md-12">
                                        <strong style="width: 70px; float: left;">Subtotal</strong>
                                        <span><%-accounting.formatMoney(total + promo_discount)%></span>
                                    </div>
                                    <div class="col-md-12">
                                        <strong style="width: 70px; float: left;">Promo</strong>
                                        <span><%-accounting.formatMoney(-promo_discount)%></span>
                                    </div>
                                    <div class="col-md-12">
                                        <strong style="width: 70px; float: left;">Total</strong>
                                        <span><%-accounting.formatMoney(total)%></span>
                                    </div>
                                </div>
                            </div>
                            <% }else{ %>
                            <div class="col-xs-6 col-md-6">
                                <label>Total</label>
                                <span class="field" style="margin-bottom: 0px;">
                                <%-accounting.formatMoney(total)%>
                            </span>
                            </div>
                            <%
                            var increment = App.data.schedules.get(teesheet_id).get('increment');
                            var retainValue = function (value) {return value;};
                            moment.relativeTimeRounding(retainValue);
                            moment.relativeTimeThreshold('m',60);
                            %>
                            <% if(FACILITY_SETTINGS.oneReservationPerTimeslot){ %>
                            <div class="col-xs-6 col-md-6">
                                <label>Reservation Length</label>
                                <span class="field" style="margin-bottom: 0px;">
                                <%-moment.duration(duration*increment, 'minutes').humanize()%>
                            </span>
                            </div>
                            <% } %>
                            <% } %>
                        </div>
                        <% } %>
                    </div>
                </div>
                <div class="col-md-6 thanks">
                    <h4>Thank you!</h4>
                    <%if(foreup_discount && total > 0 && (player_count >= trade_min_players && player_count <= available_trade_spots)) { %>
                    <p>
                        <% if(!purchased){ %>
                        <button class="btn btn-lg btn-success pay-now">
                            <span class="glyphicon glyphicon-tag" style="top: 2px"></span>
                            <% if(!has_special && promo_discount <= 0){ %>
                            Pay Now and Save <%-_.round(foreup_discount_percent,0) %>%
                            <% }else{ %>
                            Pay Online Now
                            <% } %>
                        </button>
                        <% }else{ %>
                    <h3>Your reservation has been purchased</h3>
                    <% } %>
                    </p>
                    <% } %>
                    <p>If you would like to reserve an additional time, please <a href="#/teetimes">Click Here</a></p>
                    <p>A confirmation email has been sent to <strong><%-user_email%></strong>.
                        For questions, call <%-course_name%> at <a href="tel:<%-course_phone%>"><%-course_phone%></a></p>
                </div>
            </div>
        </div>
    </div>
</script>

                            </div>

                            <h4>Checking in this way is only available before your tee time starts.</h4>

                            <p>For questions, call <%-course_name%> at <a href="tel:<%-course_phone%>"><%-course_phone%></a>.</p>
                        <% }else if(!purchased) { %>
                            <%  if(pay_total === 0) { %>
                                <h4>To check in, click the button below.</h4>
                                <button class="btn btn-lg btn-success pay-now">
                                    <span class="glyphicon glyphicon-tag" style="top: 2px"></span>
                                    Check In Now
                                </button>

                                <h4>To check in, please pay now.</h4>
                                <p>You may pay now using your saved payment methods.</p>
                                <button class="btn btn-lg btn-success pay-now">
                                    <span class="glyphicon glyphicon-tag" style="top: 2px"></span>
                                    Pay Now
                                </button>

                                <p>Add a payment method to complete check in</p>

                                    Add Payment Method
                                </button>

                        <% }else{ %>
                            <h3>You're all set!</h3>
                            <p>Thank you for checking in.</p>
                            <p>A confirmation email has been sent to <strong><%-user_email%></strong>.
                                For questions, call <%-course_name%> at <a href="tel:<%-course_phone%>"><%-course_phone%></a></p>
                        <% } %>
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/html" id="template_account_pay_for_reservation">
    <div class="modal-content billing-make-payment">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
            <h4 class="modal-title">Make a Payment</h4>
        </div>
        <div class="modal-body">
            <form role="form" id="pay_account_balance_form">
                <div id="account-balance-payment-error" class="alert alert-danger" style="display: none;"></div>
                <div class="row payment-amount-options">
                    <% if(current_balance > 0){ %>
                    <div class="col-md-4">
                        <input type="radio" name="payment_selection" value="current" class="payment-select" id="payment-current" <% if(selection == 'current'){ %>checked="checked"<% } %>>
                        <label class="payment-amount-container" for="payment-current">
                            <strong class="field-label">Current Balance</strong>
                            <span class="payment-amount"><%-accounting.formatMoney(current_balance)%></span>
                        </label>
                    </div>
                    <% } %>
                    <% if(statement_balance > 0){ %>
                    <div class="col-md-4">
                        <input type="radio" name="payment_selection" value="statement" class="payment-select" id="payment-statement" <% if(selection == 'statement'){ %>checked="checked"<% } %>>
                        <label class="payment-amount-container" for="payment-statement">
                            <strong class="field-label">Statement Balance</strong>
                            <span class="payment-amount"><%-accounting.formatMoney(statement_balance) %></span>
                        </label>
                    </div>
                    <% } %>
                    <div class="col-md-4">
                        <input aria-labelledby="payment-amount" type="radio" name="payment_selection" value="other" class="payment-select" id="payment-other" <% if(selection == 'other'){ %>checked="checked"<% } %>>
                        <label aria-labelledby="payment-amount" class="payment-amount-container" for="payment-other">
                            <strong class="field-label">Other Amount</strong>
                            <input aria-labelledby="payment-amount" type="text" name="other_payment_amount" id="other-payment-amount" class="form-control other-amount" placeholder="0.00"
                                   value="<% if(selection == 'other' && other_amount > 0){ %><%-accounting.formatMoney(other_amount, '')%><% } %>"
                            >
                        </label>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-8">
                        <label class="field-label">Payment Method</label>
                        <select id="account_payment_method" class="form-control payment-methods">
                            <% if(!payment_methods || payment_methods.length == 0){ %>
                            <option value="">No saved payment methods</option>
                            <% }else{ %>
                            <option value="">- Select Payment Method -</option>
                            <% _.each(payment_methods.models, function(payment_method){
                            let verified = true;
                            if(payment_method.get('is_dwolla') == 1 && payment_method.get('is_verified') == 0){
                            verified = false;
                            }
                            %>
                            <option <%if(!verified){ %>disabled<% } %> value="<%-payment_method.get('credit_card_id')%>" <% if(payment_method.get('credit_card_id') == credit_card_id){ %>selected<%}%>>
                            <% if(!verified){ %>(UNVERIFIED)<% } %>
                            <%-payment_method.getDescription()%>
                            </option>
                            <% }); %>
                            <% } %>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="field-label">Payment Date</label>
                        <span class="payment-date"><%-moment().format('MM/DD/YY')%></span>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12 text-danger payment-fee-warning" id="payment-fee-note"></div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <div class="row">
                <div class="col-md-12">
                    <button class="btn btn-success review pull-left">Review Payment</button>
                    <button class="btn btn-success pay pull-left" style="display: none" data-loading-text="Applying Payment...">Complete Payment</button>
                    <button class="btn btn-default back pull-left" style="display: none">Back</button>
                    <button class="btn btn-default cancel pull-left" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary confirm" style="display: none" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</script>
