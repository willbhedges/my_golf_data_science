name: course-page-one

# One course of a course-page run (called by course_page.yml, one call per course in its matrix), so each course
# goes package -> compute -> finish -> commit on its own: the first courses of a big batch are committed while the
# rest are still packaging (a plain job matrix would hold every finish until the slowest compute).
on:
  workflow_call:
    inputs:
      req:
        type: string
        required: true
      slug:
        type: string
        required: true
      compute:
        description: "JSON list of this course's compute cells [{req, slug, slot, kind}]"
        type: string
        required: true

permissions:
  contents: write

env:
  PYTHONWARNINGS: ignore

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # Bandon Dunes (run 41604633702): the runner ran out of disk in the vision step (a 5-course resort outline:
      # lidar + multi-year NAIP over the whole resort) and the job died without its course data. Drop the runner's
      # unused toolchains (.NET, Android, GHC, CodeQL: ~20 GB) first; never fails the job.
      - name: Free runner disk
        continue-on-error: true
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy shapely pyproj matplotlib pillow opencv-python-headless scikit-learn scikit-image \
                      pystac-client planetary-computer rasterio lightgbm
      # OSM without the public Overpass mirrors (course_data/platform/osm_extract.py): the state's Geofabrik .osm.pbf
      # + osmium answers resolve's and the features query's questions in Overpass's own shapes. Request
      # "osm_source": "auto" (default: Overpass first, one pass; the extract when it fails), "geofabrik" (the extract
      # only) or "overpass". The .osm.pbf is downloaded on first use and kept in the Actions cache per state + day,
      # so the courses of one state share one download.
      - name: OSM source (Overpass / Geofabrik extract)
        id: osm
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && osmium --version | head -1) || \
            echo "osmium-tool install failed: no Geofabrik fallback"
          python3 - "${{ inputs.req }}" <<'EOF'
          import json, os, sys
          sys.path.insert(0, "course_data/platform")
          import platform_common as pc
          q = json.load(open(sys.argv[1]))
          try:
              st = pc.state_code(q.get("state"))
          except ValueError:
              st = "none"
          src = str(q.get("osm_source") or "auto").lower()
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"state={st}\nsource={src}\n")
          print("state", st, "osm_source", src)
          EOF
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/geofabrik"
          echo "OSM_PBF_DIR=$HOME/geofabrik" >> "$GITHUB_ENV"
      - name: Geofabrik extract from the cache
        id: gfcache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/geofabrik/*.osm.pbf
            ~/geofabrik/*.golf.osm
          key: geofabrik-${{ steps.osm.outputs.state }}-${{ steps.osm.outputs.day }}
      - name: Resolve, package, scorecard
        id: pkg
        run: |
          R="${{ inputs.req }}"; S="${{ inputs.slug }}"
          O=$(python3 course_data/library/course_page.py slug "$R" | cut -d' ' -f2)
          echo "OUT=$O" >> "$GITHUB_ENV"; echo "S=$S" >> "$GITHUB_ENV"
          mkdir -p "$O"
          python3 course_data/library/course_page.py pkgreq "$R"
          # Overpass / Nominatim rate limits come back as "not_found": retry with a back-off. Each attempt is capped
          # (an Overpass outage made one attempt run > 1 h: Fred Arbanas hit the 150-min job timeout, so nothing was
          # recorded), no attempt starts after 70 min, and failures a retry cannot fix stop the loop at once.
          T0=$SECONDS
          SRC="${{ steps.osm.outputs.source }}"
          for t in 1 2 3; do
            # a retry never waits on Overpass again: the Geofabrik extract only (osm_extract.py)
            [ "$t" -gt 1 ] && [ "$SRC" != overpass ] && SRC=geofabrik
            echo "package attempt $t: OSM_SOURCE=$SRC"
            set +e
            OSM_SOURCE=$SRC timeout 40m python course_data/platform/package.py run "$O/package_request.json" 2>&1 | tee /tmp/pkg_v0.log
            rc=${PIPESTATUS[0]}; set -e
            [ "$rc" = 124 ] && echo "package attempt $t: timed out after 40 min (Overpass endpoints down or at capacity?)" | tee -a /tmp/pkg_v0.log
            [ -f course_data/packages/$S/package.json ] && break
            grep -qE "ambiguous|: closed: |no holes built" /tmp/pkg_v0.log && break
            [ $((SECONDS - T0)) -gt 4200 ] && break
            sleep $((t * 90))
          done
          if [ ! -f course_data/packages/$S/package.json ]; then
            python3 course_data/library/course_page.py failed "$R" package "$(tail -n 3 /tmp/pkg_v0.log | tr '\n' ' ' | cut -c1-400)"
            echo "ok=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cp course_data/packages/$S/package.json "$O/package_v0_no_vision.json"
          echo "ok=1" >> "$GITHUB_OUTPUT"
          # which OSM the package used; the OB evidence step (vision layers) follows a Geofabrik build
          U=$(python3 -c "import json;print(json.load(open('course_data/packages/$S/raw/osm_source.json')).get('source',''))" 2>/dev/null || true)
          echo "OSM used: ${U:-?}"
          case "$U" in geofabrik*) echo "OSM_SOURCE=geofabrik" >> "$GITHUB_ENV";; esac
      - name: Keep the Geofabrik extract for the state's other courses
        if: always() && steps.gfcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          ls -la "$HOME/geofabrik" || true
          if ls "$HOME"/geofabrik/*.osm.pbf >/dev/null 2>&1; then echo "save=1" >> "$GITHUB_OUTPUT"; fi
        id: gfhave
      - name: Save the Geofabrik extract to the cache
        if: always() && steps.gfhave.outputs.save == '1'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/geofabrik/*.osm.pbf
            ~/geofabrik/*.golf.osm
          key: geofabrik-${{ steps.osm.outputs.state }}-${{ steps.osm.outputs.day }}
      # the same vision layer + OB evidence step as course_package.yml (one composite action, one script:
      # course_data/vision_any/build_layers.py): raw (3DEP lidar HAG + NAIP years), raw2 (multi-year NAIP +
      # lidar point statistics, Actions cache), v2 inference (trees, water; long grass per model_v2/model.json),
      # OB evidence
      - name: Vision layer + OB evidence
        if: steps.pkg.outputs.ok == '1'
        continue-on-error: true
        uses: ./.github/actions/vision-layers
        with:
          slugs: ${{ inputs.slug }}
          refresh: "true"
      - name: Rebuild the package with vision + OB
        if: steps.pkg.outputs.ok == '1'
        run: |
          python course_data/platform/package.py build "$OUT/package_request.json" || echo "rebuild failed: keeping v0"
          grep -E '"(vision|ob)":' -o course_data/packages/$S/package.json | head -3 || true
      - name: Bases, weather, display imagery
        if: steps.pkg.outputs.ok == '1'
        id: cfg
        run: |
          python3 course_data/library/course_page.py configure "${{ inputs.req }}" | tee /tmp/cfg.txt
          grep '^SHARP_' /tmp/cfg.txt >> "$GITHUB_OUTPUT"
      - name: Sharpest leaf-on NAIP (display only)
        if: steps.pkg.outputs.ok == '1' && steps.cfg.outputs.SHARP_YEAR != ''
        continue-on-error: true
        run: |
          python course_data/imagery/fetch_imagery.py --bbox ${{ steps.cfg.outputs.SHARP_BBOX }} --margin 0 \
            --year ${{ steps.cfg.outputs.SHARP_YEAR }} --lo-res 0.3 --no-dem --name "$S" --out /tmp/sharp
      - name: Prepare the solved bases (course module, hole pictures, elevation)
        if: steps.pkg.outputs.ok == '1'
        run: |
          IM=""; [ -f /tmp/sharp/georef.json ] && IM="--imagery /tmp/sharp"
          python3 course_data/library/course_page.py prepare "${{ inputs.req }}" $IM || \
            python3 course_data/library/course_page.py prepare "${{ inputs.req }}"
          du -sh "$OUT" "$OUT"/* || true
      # golfer native-grass taps for the library page (request "agent_layers" + the mapper's frames / edits / zones):
      # the error-budget planner on every answer state, here because the DEM and lidar canopy it reads are on disk;
      # eagle_bend: 14 framed holes, 59 decisions, about 1 min on 4 cores. Never fails the build (native.json notes why)
      - name: Native-grass questions (library check cards)
        if: steps.pkg.outputs.ok == '1'
        continue-on-error: true
        timeout-minutes: 20
        run: python3 course_data/library/course_page.py native "${{ inputs.req }}"
      - name: Keep the vision layer + OB evidence (small) with the course data
        if: steps.pkg.outputs.ok == '1'
        run: |
          mkdir -p "$OUT/evidence"
          cp course_data/vision_any/$S/vision_any.geojson "$OUT/evidence/" 2>/dev/null || true
          cp course_data/ob/$S/sources.json "$OUT/evidence/ob_sources.json" 2>/dev/null || true
          cp course_data/vision_any/$S/raw/meta.json "$OUT/evidence/vision_raw_meta.json" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ inputs.slug }}-pkg
          path: ${{ env.OUT }}
          retention-days: 7

  compute:
    needs: [package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.compute) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy matplotlib pillow rasterio pyproj shapely opencv-python-headless
      - name: Course data from the package job
        id: get
        run: |
          O=$(python3 course_data/library/course_page.py slug "${{ inputs.req }}" | cut -d' ' -f2)
          echo "OUT=$O" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lib-${{ inputs.slug }}-pkg
          path: ${{ env.OUT }}
      - name: ${{ matrix.kind }} (base ${{ matrix.slot }})
        run: |
          if [ ! -f "$OUT/auto/course.py" ]; then echo "no prepared course (package failed)"; mkdir -p parts; exit 0; fi
          python3 course_data/library/course_page.py compute "${{ inputs.req }}" ${{ matrix.slot }} ${{ matrix.kind }} parts
          tail -n 2 parts/log_* 2>/dev/null | tail -n 40 || true
      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ inputs.slug }}-part-${{ matrix.slot }}-${{ matrix.kind }}
          path: parts/
          retention-days: 7
          if-no-files-found: ignore

  finish:
    needs: [package, compute]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          pip install numpy scipy matplotlib pillow rasterio pyproj shapely opencv-python-headless
          npm install --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
      - id: get
        run: |
          O=$(python3 course_data/library/course_page.py slug "${{ inputs.req }}" | cut -d' ' -f2)
          echo "OUT=$O" >> "$GITHUB_ENV"; echo "S=${{ inputs.slug }}" >> "$GITHUB_ENV"
      - name: Never overwrite a hand-checked page
        run: |
          if python3 -c "import json,sys;sys.exit(0 if json.load(open('$OUT/config.json')).get('hand_checked') else 1)" 2>/dev/null; then
            echo "hand_checked page at $OUT: refusing to overwrite"; exit 1
          fi
      - uses: actions/download-artifact@v4
        id: pkgart
        continue-on-error: true
        with:
          name: lib-${{ inputs.slug }}-pkg
          path: ${{ env.OUT }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: lib-${{ inputs.slug }}-part-*
          path: /tmp/parts
      - name: Merge, page, checks, report
        run: |
          ls /tmp/parts || true
          set -o pipefail
          if [ -f "$OUT/auto/course.py" ]; then
            # the output is kept: a failure's last exception lines go in status.json "reasons"
            python3 course_data/library/course_page.py finish "${{ inputs.req }}" /tmp/parts 2>&1 | tee /tmp/finish.log || \
              python3 course_data/library/course_page.py failed --log /tmp/finish.log "${{ inputs.req }}" finish "merge / page / checks failed"
          elif [ "${{ steps.pkgart.outcome }}" != success ]; then
            # no package artifact: the package job died without recording anything (Troon North, run 41539188571:
            # runner shut down, exit 143). The checkout's status.json is an OLD run's, so record this one
            # (`failed` keeps a last good page and notes the attempt beside it)
            python3 course_data/library/course_page.py failed "${{ inputs.req }}" package \
              "package job ended without its course data (job result: ${{ needs.package.result }}; runner lost or out of memory? see the Actions log)"
          elif [ ! -f "$OUT/status.json" ]; then
            python3 course_data/library/course_page.py failed "${{ inputs.req }}" package "no prepared course (see the Actions log)"
          fi
          cat "$OUT/qa_report.md" | head -60 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # committed: the page, its checks and the small course data to rebuild it (README.md "size policy");
          # never the course modules, hole pictures, wind grids or rasters
          for f in config.json package_request.json package.json package_qa.md package_confirm.json \
                   weather.json sharp.json page.html qa_report.md qa.json status.json raw/course.json raw/summary.json \
                   raw/scorecard_web.json evidence/vision_any.geojson evidence/ob_sources.json evidence/vision_raw_meta.json \
                   native.json; do
            [ -f "$OUT/$f" ] && git add -f "$OUT/$f"
          done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git diff --cached --stat | tail -3
          printf '%s\n' "course-page: $S (GitHub Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5 6 7 8; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}"; then
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i * 10 + RANDOM % 10))
          done
          exit 1

