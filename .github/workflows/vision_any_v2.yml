name: vision-any-v2

# Long-grass + tree-edge model v2 (course_data/vision_any/v2_*.py).
# Trigger (ARCHITECTURE.md 9.4): push a change to course_data/requests/vision_v2_*.json:
#   {"schema": "request/1", "kind": "vision_v2", "slugs": ["spirit_hollow", "mozingo", "veenker"],
#    "eval": true, "integrate": "auto", "rev": "..."}
# 1. fetch  (per course): multi-year NAIP at 1 m + 3DEP point-cloud statistics (PDAL) into raw2/ (Actions cache,
#           not committed)
# 2. model: LOHO / cross-course evaluation vs v1, strategy impact, product model (model_v2/), inference for every
#           slug; integrate = auto replaces vision_any.geojson with v2 only if the report's decision says so.
on:
  push:
    paths:
      - "course_data/requests/vision_v2_*.json"
      - ".github/workflows/vision_any_v2.yml"

permissions:
  contents: write

concurrency:
  group: vision-any-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.p.outputs.slugs }}
      eval: ${{ steps.p.outputs.eval }}
      integrate: ${{ steps.p.outputs.integrate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: p
        run: |
          R=$(ls -t course_data/requests/vision_v2_*.json | head -1)
          echo "request: $R"; cat "$R"
          python3 - "$R" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print("slugs=" + json.dumps(r.get("slugs", ["spirit_hollow", "mozingo", "veenker"])))
          print("eval=" + ("true" if r.get("eval", True) else "false"))
          print("integrate=" + str(r.get("integrate", "auto")))
          EOF

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJson(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: cache
        uses: actions/cache@v4
        with:
          path: course_data/vision_any/${{ matrix.slug }}/raw2
          key: v2raw-${{ matrix.slug }}-${{ hashFiles('course_data/vision_any/v2_fetch.py') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy shapely pyproj pystac-client planetary-computer rasterio
      - uses: mamba-org/setup-micromamba@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          environment-name: pdal
          create-args: pdal
          init-shell: none
          cache-environment: true
      - name: Fetch multi-year NAIP + lidar point statistics
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export PDAL_BIN="$MAMBA_ROOT_PREFIX/envs/pdal/bin/pdal"
          python -u course_data/vision_any/v2_fetch.py --slug "${{ matrix.slug }}"
          ls -la course_data/vision_any/${{ matrix.slug }}/raw2
      - uses: actions/upload-artifact@v4
        with:
          name: raw2-${{ matrix.slug }}
          path: course_data/vision_any/${{ matrix.slug }}/raw2
          retention-days: 7

  model:
    needs: [plan, fetch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Pull latest
        run: git pull --rebase origin "${{ github.ref_name }}" || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pillow shapely pyproj rasterio scikit-learn scikit-image lightgbm opencv-python-headless matplotlib pytest
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/raw2
      - name: Place raw2
        run: |
          for d in /tmp/raw2/raw2-*; do
            s=${d#/tmp/raw2/raw2-}; mkdir -p course_data/vision_any/$s/raw2; cp -r $d/* course_data/vision_any/$s/raw2/ || true
            echo "== $s"; ls -la course_data/vision_any/$s/raw2; cat course_data/vision_any/$s/raw2/meta2.json | head -c 3000 || true
          done
      - name: Unit tests
        run: python -m pytest -q course_data/vision_any/test_v2.py
      - name: Evaluate (LOHO, cross-course, strategy) + product model
        if: needs.plan.outputs.eval == 'true'
        env:
          PYTHONWARNINGS: ignore
        run: python -u course_data/vision_any/v2_model.py --eval
      - name: Inference + integration
        env:
          PYTHONWARNINGS: ignore
        run: |
          SLUGS=$(python3 -c 'import json,sys;print(" ".join(json.loads(sys.argv[1])))' '${{ needs.plan.outputs.slugs }}')
          python -u course_data/vision_any/v2_model.py --infer $SLUGS --integrate "${{ needs.plan.outputs.integrate }}"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in course_data/vision_any/v2_report.md course_data/vision_any/v2_report.json course_data/vision_any/model_v2 \
                   course_data/vision_any/*/vision_any_v2.geojson course_data/vision_any/*/classes_v2.jpg \
                   course_data/vision_any/*/layers_v2.tif course_data/vision_any/*/vision_any.geojson \
                   course_data/vision_any/*/vision_any_v1.geojson; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          printf '%s\n' \
            "vision_any v2: long grass + tree edges, evaluation + layers (GitHub Actions run ${{ github.run_id }})" \
            "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
