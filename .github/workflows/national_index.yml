name: national-index

# National course index (course_data/library/national_index.py, README "National course index"):
# every named leisure=golf_course in the US from OpenStreetMap, fetched in 1-degree grid cells (one bbox Overpass
# query per cell, each cell tried on every mirror, split in four when none answers), written cell by cell so a
# time-out loses one cell, not a state. Trigger: push course_data/requests/national_index_<name>.json
#   {"states": [] (all 50 + DC) or ["IA", ...], "shards": 6, "budget_min": 95,
#    "reuse_run": <run id> (seed the cells from that run's artifacts: only missing cells are fetched),
#    "oga_run": <run id> (OpenGolfAPI listings from that run's natoga artifact),
#    "oga_states": ["KY", ...] (fetch these listings fresh; 1,000 anonymous calls / day), "rev": n}
# At most `shards` (default 6) fetch jobs run at once: other builds share the 20 runners.
# Output (committed by the merge job): course_data/library/us_courses.json.gz, us_readiness.json and the
# README counts block. States without enough cells keep their rows from the committed index.
on:
  push:
    paths:
      - "course_data/requests/national_index_*.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: national-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      n: ${{ steps.p.outputs.n }}
      states: ${{ steps.p.outputs.states }}
      reuse_run: ${{ steps.p.outputs.reuse_run }}
      oga_run: ${{ steps.p.outputs.oga_run }}
      oga_states: ${{ steps.p.outputs.oga_states }}
      budget: ${{ steps.p.outputs.budget }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            course_data/requests
            course_data/library/national_index.py
      - id: p
        run: |
          R=$(git diff --name-only HEAD~1 HEAD -- 'course_data/requests/national_index_*.json' | tail -1)
          [ -n "$R" ] || R=$(ls -t course_data/requests/national_index_*.json | head -1)
          echo "request: $R"; cat "$R"
          python3 - "$R" <<'EOF'
          import json, os, sys
          sys.path.insert(0, "course_data/library")
          import national_index as ni
          q = json.load(open(sys.argv[1]))
          states = [s.upper() for s in (q.get("states") or ni.STATES)]
          n = max(1, min(6, int(q.get("shards") or 6), len(ni.cells_for(states))))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("shards=" + json.dumps(list(range(n))) + "\n")
              fh.write("n=" + str(n) + "\n")
              fh.write("states=" + " ".join(states) + "\n")
              fh.write("reuse_run=" + str(q.get("reuse_run") or "") + "\n")
              fh.write("oga_run=" + str(q.get("oga_run") or "") + "\n")
              fh.write("oga_states=" + " ".join(q.get("oga_states") or []) + "\n")
              fh.write("budget=" + str(int(q.get("budget_min") or 95)) + "\n")
          print(n, "shards,", len(ni.cells_for(states)), "cells")
          EOF

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 140
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            course_data/library/national_index.py
            course_data/platform/osm_guard.py
            course_data/platform/platform_common.py
      - name: Seed cells from an earlier run
        if: needs.plan.outputs.reuse_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: natidx-*
          merge-multiple: true
          path: /tmp/seed
          run-id: ${{ needs.plan.outputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Fetch cells
        run: |
          mkdir -p /tmp/natidx/cells /tmp/seed
          # keep only this shard's cells (and the quarters of a split cell) from the seed
          python3 - ${{ matrix.shard }} ${{ needs.plan.outputs.n }} ${{ needs.plan.outputs.states }} <<'EOF'
          import glob, os, shutil, sys
          sys.path.insert(0, "course_data/library")
          import national_index as ni
          mine = ni.shard_cells(sys.argv[3:], int(sys.argv[1]), int(sys.argv[2]))
          k = 0
          for p in glob.glob("/tmp/seed/**/c_*.json", recursive=True):
              s, w, n, e = (float(x) for x in os.path.basename(p)[2:-5].split("_"))
              if any(c[0] <= s and n <= c[2] and c[1] <= w and e <= c[3] for c in mine):
                  shutil.copy(p, "/tmp/natidx/cells/")
                  k += 1
          print("seeded", k, "cell files for", len(mine), "cells")
          EOF
          NATIDX_BUDGET_MIN=${{ needs.plan.outputs.budget }} python3 -u course_data/library/national_index.py fetch \
            ${{ needs.plan.outputs.states }} --shard ${{ matrix.shard }}/${{ needs.plan.outputs.n }} --out /tmp/natidx || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natidx-${{ matrix.shard }}
          path: /tmp/natidx
          if-no-files-found: ignore

  merge:
    needs: [plan, fetch]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            course_data/library/national_index.py
            course_data/library/index.json
            course_data/library/us_courses.json.gz
            course_data/library/us_readiness.json
            course_data/library/README.md
            course_data/platform/osm_guard.py
            course_data/platform/platform_common.py
      - run: pip install -q shapely pyshp
      - name: Cells of the reused run (this run's cells overwrite them)
        if: needs.plan.outputs.reuse_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: natidx-*
          merge-multiple: true
          path: /tmp/natidx
          run-id: ${{ needs.plan.outputs.reuse_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: natidx-*
          merge-multiple: true
          path: /tmp/natidx
      - name: OpenGolfAPI listings of an earlier run
        if: needs.plan.outputs.oga_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: natoga
          path: /tmp/oga_all
          run-id: ${{ needs.plan.outputs.oga_run }}
          github-token: ${{ github.token }}
      - name: Fresh OpenGolfAPI listings
        if: needs.plan.outputs.oga_states != ''
        run: |
          python3 -u course_data/library/national_index.py oga ${{ needs.plan.outputs.oga_states }} --out /tmp/oga_new || true
          mkdir -p /tmp/oga_all /tmp/oga_new && cp -f /tmp/oga_new/*.json /tmp/oga_all/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: natoga
          path: /tmp/oga_all
          if-no-files-found: ignore
      - name: Merge, commit
        run: |
          mkdir -p /tmp/natidx /tmp/oga_all
          echo "cells: $(find /tmp/natidx -name 'c_*.json' | wc -l); oga listings: $(ls /tmp/oga_all | wc -l)"
          python3 -u course_data/library/national_index.py merge /tmp/natidx --oga /tmp/oga_all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/library/us_courses.json.gz course_data/library/us_readiness.json course_data/library/README.md
          git diff --cached --quiet && exit 0
          printf '%s\n' "library: national course index (Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed"; sleep $((i * 10))
          done
          exit 1
