name: web-fetch

# Fetch a few public web pages (scorecards, tournament pages) that the sandbox cannot reach, and commit them as
# text so a mapper can read them. Trigger: push course_data/requests/webfetch_<name>.json
#   {"name": "blue_hills", "urls": ["https://...", ...], "rev": n}
# Output: course_data/research/web/<name>/<nn>.html (raw, capped at 2 MB) + <nn>.txt (tags stripped) + index.json.
on:
  push:
    paths:
      - "course_data/requests/webfetch_*.json"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fetch
        run: |
          # every request changed by THIS push (not the branch tip: parallel pushes used to steal each other's run)
          B="${{ github.event.before }}"
          if git cat-file -e "$B^{commit}" 2>/dev/null; then
            RS=$(git diff --name-only "$B" "${{ github.sha }}" -- 'course_data/requests/webfetch_*.json')
          else
            RS=$(git diff --name-only HEAD~1 HEAD -- 'course_data/requests/webfetch_*.json')
          fi
          [ -n "$RS" ] || RS=$(ls -t course_data/requests/webfetch_*.json | head -1)
          for R in $RS; do
          [ -f "$R" ] || continue
          echo "== $R"
          python3 - "$R" <<'EOF'
          import json, os, re, sys, html, urllib.request
          q = json.load(open(sys.argv[1]))
          out = os.path.join("course_data/research/web", q["name"])
          os.makedirs(out, exist_ok=True)
          idx = []
          for i, u in enumerate(q["urls"]):
              rec = dict(i=i, url=u)
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                                                           "(KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                                                           "Accept": "text/html,application/json;q=0.9,*/*;q=0.8"})
                  b = urllib.request.urlopen(req, timeout=40).read()[:2_000_000]
                  t = b.decode("utf-8", "replace")
                  open(os.path.join(out, f"{i:02d}.html"), "w").write(t)
                  s = re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", t)
                  s = re.sub(r"(?s)<[^>]+>", " ", s)
                  s = re.sub(r"[ \t\r\f\v]+", " ", html.unescape(s))
                  s = re.sub(r"\n\s*\n+", "\n", s)
                  open(os.path.join(out, f"{i:02d}.txt"), "w").write(s)
                  rec.update(ok=True, bytes=len(b))
              except Exception as e:
                  rec.update(ok=False, error=str(e)[:300])
              print(rec)
              idx.append(rec)
          json.dump(idx, open(os.path.join(out, "index.json"), "w"), indent=1)
          EOF
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/research/web
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          printf '%s\n' "web-fetch: pages for a mapper (GitHub Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 10))
          done
          exit 1
