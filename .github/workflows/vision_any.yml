name: vision-any

# Any-course hazard vision (course_data/vision_any): fetch 3DEP lidar height-above-ground, lidar
# classification, DTM, Meta 1 m canopy height, ESA WorldCover and NAIP (2 years) for every course in
# course_data/vision_any/courses.txt (or the dispatched one) into course_data/vision_any/<slug>/raw/.
# The layers are built offline: python3 course_data/vision_any/run_any.py --slug <slug> --course-dir <dir>

on:
  push:
    paths:
      - ".github/workflows/vision_any.yml"
      - "course_data/vision_any/fetch_any.py"
      - "course_data/vision_any/courses.txt"
  workflow_dispatch:
    inputs:
      slug:
        description: "Course slug (empty = every line of courses.txt)"
        default: ""
      course_dir:
        description: "Course dir with summary.json / osm.geojson"
        default: ""
      bbox:
        description: "Optional S,W,N,E instead of course_dir"
        default: ""

permissions:
  contents: write

concurrency:
  group: vision-any-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy pillow shapely pyproj pystac-client planetary-computer rasterio

      # PDAL CLI (conda-forge) for the raw 3DEP point clouds (EPT on AWS) where Planetary Computer has no
      # lidar products; fetch_any.py finds it through $PDAL_BIN
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pdal
          create-args: pdal
          init-shell: none
          cache-environment: true

      - name: Locate PDAL
        run: |
          P="$MAMBA_ROOT_PREFIX/envs/pdal/bin/pdal"
          ls -la "$P" && "$P" --version && echo "PDAL_BIN=$P" >> "$GITHUB_ENV" || echo "no pdal"

      - name: Fetch rasters
        env:
          SLUG: ${{ inputs.slug }}
          CDIR: ${{ inputs.course_dir }}
          BBOX: ${{ inputs.bbox }}
        run: |
          set -x
          if [ -n "$SLUG" ]; then
            if [ -n "$BBOX" ]; then
              python course_data/vision_any/fetch_any.py --slug "$SLUG" --bbox "$BBOX" || echo "fetch failed: $SLUG"
            else
              python course_data/vision_any/fetch_any.py --slug "$SLUG" --course-dir "$CDIR" || echo "fetch failed: $SLUG"
            fi
          else
            grep -v '^#' course_data/vision_any/courses.txt | while read -r slug cdir; do
              [ -z "$slug" ] && continue
              if [ -f "course_data/vision_any/$slug/raw/meta.json" ]; then echo "already fetched: $slug"; continue; fi
              python course_data/vision_any/fetch_any.py --slug "$slug" --course-dir "$cdir" || echo "fetch failed: $slug"
            done
          fi
          du -ah course_data/vision_any | sort -h | tail -30

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/vision_any
          if git diff --cached --quiet; then
            echo "Nothing to commit"; exit 0
          fi
          printf '%s\n' \
            "vision_any: lidar/NAIP rasters and layers (GitHub Actions run ${{ github.run_id }})" \
            "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
