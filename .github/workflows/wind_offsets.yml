name: wind-offsets

# Wind grids with every tee moved back/forward along its line (tee-box picker on the wind page).
# Trigger: push a change to course_data/requests/wind_offsets.json ({"offsets": [-100, ..., 80]}).
on:
  push:
    paths:
      - "course_data/requests/wind_offsets.json"
      - ".github/workflows/wind_offsets.yml"

permissions:
  contents: write

concurrency:
  group: wind-offsets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      offsets: ${{ steps.o.outputs.offsets }}
    steps:
      - uses: actions/checkout@v4
      - id: o
        run: echo "offsets=$(python3 -c 'import json;print(json.dumps(json.load(open("course_data/requests/wind_offsets.json"))["offsets"]))')" >> "$GITHUB_OUTPUT"

  grid:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        back: ${{ fromJson(needs.plan.outputs.offsets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy matplotlib pillow
      - name: Wind grid, tee moved ${{ matrix.back }} yds back
        env:
          TEE_BACK: ${{ matrix.back }}
        run: python spirit_hollow/wind_grid.py
      - uses: actions/upload-artifact@v4
        with:
          name: grid-${{ matrix.back }}
          path: spirit_hollow/output/wind_grid_back*.json

  commit:
    needs: grid
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/grids
      - name: Commit grids
        run: |
          mkdir -p spirit_hollow/output
          find /tmp/grids -name 'wind_grid_back*.json' -exec cp {} spirit_hollow/output/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f spirit_hollow/output/wind_grid_back*.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          printf '%s\n' \
            "Wind grids for tee offsets (GitHub Actions run ${{ github.run_id }})" \
            "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
