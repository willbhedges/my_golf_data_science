name: osm-check

# OSM completeness count for candidate library courses (course_data/library/osm_check.py).
# Trigger: push course_data/requests/osm_check_<name>.json -> commits course_data/library/osm_check/<name>.json
on:
  push:
    paths:
      - "course_data/requests/osm_check_*.json"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 50
      - run: pip install requests
      - name: Overpass counts
        run: |
          B="${{ github.event.before }}"
          if [ -n "$B" ] && git cat-file -e "$B^{commit}" 2>/dev/null; then R="$B"; else R=HEAD~1; fi
          mkdir -p course_data/library/osm_check
          for f in $(git diff --name-only "$R" "${{ github.sha }}" -- 'course_data/requests/osm_check_*.json'); do
            [ -f "$f" ] || continue
            n=$(basename "$f" .json | sed 's/^osm_check_//')
            python3 course_data/library/osm_check.py "$f" "course_data/library/osm_check/$n.json"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/library/osm_check/*.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          printf '%s\n' "osm-check: Overpass completeness counts (GitHub Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
