name: zero-tap-evidence

# Workstream B (course_data/ZERO_TAP_PLAN.md): outside evidence of hole numbers (course websites, golfify,
# OpenGolfAPI) registered to NAIP. Request-file trigger: commit
#   course_data/zero_tap/evidence/requests/evidence_probe_<name>.json
#   {"schema": "request/1", "set": "validation" | "slugs", "slugs": [...], "shards": 6, "register": true,
#    "run": "<name>"}
# Each shard writes course_data/zero_tap/evidence/runs/<run>/<slug>.json; the collect job commits them.

on:
  push:
    paths:
      - "course_data/zero_tap/evidence/requests/evidence_probe_*.json"

permissions:
  contents: write

concurrency:
  group: zero-tap-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      run: ${{ steps.p.outputs.run }}
      args: ${{ steps.p.outputs.args }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 20
      - id: p
        run: |
          BEFORE="${{ github.event.before }}"
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'course_data/zero_tap/evidence/requests/evidence_probe_*.json' > /tmp/req.txt
          else
            ls course_data/zero_tap/evidence/requests/evidence_probe_*.json > /tmp/req.txt
          fi
          python - <<'PY'
          import json, os
          reqs = [l.strip() for l in open("/tmp/req.txt") if l.strip() and os.path.exists(l.strip())]
          r = json.load(open(sorted(reqs)[-1]))
          if r.get("set", "validation") == "validation":
              v = json.load(open("course_data/generalize/validation_set.json"))
              slugs = [c["slug"] for c in v["courses"] if c.get("status") == "ok"]
          else:
              slugs = r["slugs"]
          n = max(1, min(6, int(r.get("shards", 6))))
          shards = [",".join(slugs[i::n]) for i in range(n)]
          shards = [s for s in shards if s]
          out = dict(shards=json.dumps(shards), run=r.get("run", "probe"),
                     args="" if r.get("register", True) else "--no-register")
          print(out)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, v in out.items():
                  fh.write(f"{k}={v}\n")
          PY

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slugs: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils > /dev/null
          pip install -q requests numpy pyproj pillow opencv-python-headless shapely pystac-client planetary-computer rasterio
      - name: Probe
        run: |
          python -u course_data/zero_tap/evidence/probe.py --slugs "${{ matrix.slugs }}" \
            --out out/${{ needs.plan.outputs.run }} ${{ needs.plan.outputs.args }}
      - id: name
        run: echo "h=$(echo '${{ matrix.slugs }}' | md5sum | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ev-${{ steps.name.outputs.h }}
          path: out
          if-no-files-found: warn

  collect:
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: ev-*
          merge-multiple: true
      - name: Commit
        run: |
          mkdir -p course_data/zero_tap/evidence/runs
          cp -r art/* course_data/zero_tap/evidence/runs/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/zero_tap/evidence/runs
          if git diff --cached --quiet; then echo "nothing"; exit 0; fi
          printf '%s\n' "Zero-tap evidence probe ${{ needs.plan.outputs.run }} (GitHub Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "${{ github.ref_name }}" && git push -q origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 10))
          done
          exit 1
