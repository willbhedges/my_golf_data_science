name: zero-tap-evidence

# Workstream B (course_data/ZERO_TAP_PLAN.md): outside evidence of hole numbers (course websites, golfify,
# OpenGolfAPI) registered to NAIP. Request-file trigger: commit
#   course_data/zero_tap/evidence/requests/evidence_probe_<name>.json
#   {"schema": "request/1", "set": "validation" | "slugs" | "none", "slugs": [...], "shards": 6,
#    "register": true, "overpass": false, "run": "<name>"}
# Each shard writes course_data/zero_tap/evidence/runs/<run>/<slug>.json; "overpass": true also measures the
# population coverage of OSM green/tee refs (osm_ref_population.json). The collect job commits both.

on:
  push:
    paths:
      - "course_data/zero_tap/evidence/requests/evidence_probe_*.json"

permissions:
  contents: write

concurrency:
  group: zero-tap-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      run: ${{ steps.p.outputs.run }}
      args: ${{ steps.p.outputs.args }}
      overpass: ${{ steps.p.outputs.overpass }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 20
      - id: p
        run: |
          BEFORE="${{ github.event.before }}"
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'course_data/zero_tap/evidence/requests/evidence_probe_*.json' > /tmp/req.txt
          else
            ls course_data/zero_tap/evidence/requests/evidence_probe_*.json > /tmp/req.txt
          fi
          python - <<'PY'
          import json, os
          reqs = [l.strip() for l in open("/tmp/req.txt") if l.strip() and os.path.exists(l.strip())]
          import subprocess
          def ct(f):   # newest-committed request wins (BEFORE may be outside the shallow clone)
              o = subprocess.run(["git", "log", "-1", "--format=%ct", "--", f], capture_output=True, text=True).stdout
              return int(o.strip() or 0)
          r = json.load(open(max(reqs, key=lambda f: (ct(f), f))))
          kind = r.get("set", "validation")
          if kind == "validation":
              v = json.load(open("course_data/generalize/validation_set.json"))
              slugs = [c["slug"] for c in v["courses"] if c.get("status") == "ok"]
          elif kind in ("bench", "bench_rest", "bench_all"):
              b = json.load(open("course_data/zero_tap/benchmark.json"))["courses"]
              v = [c["slug"] for c in json.load(open("course_data/generalize/validation_set.json"))["courses"]]
              done = set(v) if kind == "bench_rest" else set()
              slugs = [c["slug"] for c in b if c.get("in_bench") and c["slug"] not in done]
              if kind == "bench_all":
                  slugs += [s for s in v if s not in slugs]
          elif kind == "none":
              slugs = []
          else:
              slugs = r["slugs"]
          n = max(1, min(16, int(r.get("shards", 6))))
          shards = [",".join(slugs[i::n]) for i in range(n)]
          shards = [s for s in shards if s] or ["none"]
          out = dict(shards=json.dumps(shards), run=r.get("run", "probe"),
                     args=(f"--reregister {r['reregister']}" if r.get("reregister")
                           else "" if r.get("register", True) else "--no-register"),
                     overpass="1" if r.get("overpass") else "0")
          print(out)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, v in out.items():
                  fh.write(f"{k}={v}\n")
          PY

  osm_refs:
    needs: plan
    if: needs.plan.outputs.overpass == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python -u course_data/zero_tap/evidence/osm_ref_population.py
      - uses: actions/upload-artifact@v4
        with:
          name: osmref
          path: course_data/zero_tap/evidence/osm_ref_population.json

  shard:
    needs: plan
    if: needs.plan.outputs.shards != '["none"]'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        slugs: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils > /dev/null
          pip install -q requests numpy pyproj pillow opencv-python-headless shapely pystac-client planetary-computer rasterio
      - name: Probe
        run: |
          python -u course_data/zero_tap/evidence/probe.py --slugs "${{ matrix.slugs }}" \
            --out out/${{ needs.plan.outputs.run }} ${{ needs.plan.outputs.args }}
      - id: name
        run: echo "h=$(echo '${{ matrix.slugs }}' | md5sum | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ev-${{ steps.name.outputs.h }}
          path: out
          if-no-files-found: warn

  collect:
    needs: [plan, shard, osm_refs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: art
          pattern: ev-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: osmref
          path: osmref
      - name: Commit
        run: |
          mkdir -p course_data/zero_tap/evidence/runs
          cp -r art/* course_data/zero_tap/evidence/runs/ 2>/dev/null || true
          cp osmref/osm_ref_population.json course_data/zero_tap/evidence/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/zero_tap/evidence/runs || true
          git add course_data/zero_tap/evidence/osm_ref_population.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing"; exit 0; fi
          printf '%s\n' "Zero-tap evidence probe ${{ needs.plan.outputs.run }} (GitHub Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "${{ github.ref_name }}" && git push -q origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 10))
          done
          exit 1
