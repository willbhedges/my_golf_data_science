name: perception

# Course perception from first principles (course_data/perception/): NAIP + 3DEP lidar -> a structured scene
# (greens / practice greens, tee complexes, fairway corridors, bunkers, water, trees, cart-path graph,
# buildings, parking, clubhouse, driving range) per course, evaluated against OSM on held-out states.
# Request-file trigger (ARCHITECTURE 9.4): commit course_data/requests/perception_<name>.json
#   {"schema": "request/1", "kind": "perception", "stage": "stacks" | "all" | "fast",
#    "slugs": "auto" | [...], "dev_crops": ["urbana_il"], "rev": "<anything, to re-trigger>"}
# stacks: one job per course (max 6): rasters -> stack.npz in the Actions cache (perc-stack-v1-<slug>)
# all:    + perceive.py per course (scene, eval, training tables) -> report job: train.py + report.py,
#           commit models, scenes, eval, REPORT.md; also saves every stack in one cache (perc-stacks-all-<run>)
# fast:   one job: restore that combined cache, perceive every course (4 processes), train, report, commit

on:
  push:
    paths:
      - "course_data/requests/perception_*.json"

permissions:
  contents: write

concurrency:
  group: perception-${{ github.ref }}
  cancel-in-progress: false

env:
  HF_HOME: /home/runner/hf_cache
  HF_HUB_DISABLE_TELEMETRY: "1"
  PYTHONWARNINGS: ignore

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.p.outputs.stage }}
      slugs: ${{ steps.p.outputs.slugs }}
      dev: ${{ steps.p.outputs.dev }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: p
        run: |
          R=$(ls -t course_data/requests/perception_*.json | head -1)
          BEFORE="${{ github.event.before }}"
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            C=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'course_data/requests/perception_*.json' | tail -1)
            [ -n "$C" ] && [ -f "$C" ] && R="$C"
          fi
          echo "request: $R"; cat "$R"
          python3 - "$R" >> "$GITHUB_OUTPUT" <<'EOF'
          import glob, json, os, sys
          r = json.load(open(sys.argv[1]))
          slugs = r.get("slugs", "auto")
          if slugs == "auto":
              slugs = []
              for p in sorted(glob.glob("course_data/generalize/courses/*/course.json")):
                  c = json.load(open(p))
                  if c.get("status") == "ok" and c.get("bbox"):
                      slugs.append(os.path.basename(os.path.dirname(p)))
              vs = "course_data/generalize/validation_set.json"
              if os.path.exists(vs):
                  slugs += [c["slug"] for c in json.load(open(vs))["courses"] if c["slug"] not in slugs]
          if r.get("exclude"):
              slugs = [s for s in slugs if s not in r["exclude"]]
          print("stage=" + r.get("stage", "all"))
          print("slugs=" + json.dumps(slugs or ["none"]))
          print("dev=" + " ".join(r.get("dev_crops", [])))
          EOF

  course:
    needs: plan
    if: needs.plan.outputs.stage != 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Pull latest
        run: git pull -q --rebase origin "${{ github.ref_name }}" || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: course_data/perception/work/${{ matrix.slug }}
          key: perc-stack-v2-${{ matrix.slug }}
          restore-keys: perc-stack-v1-${{ matrix.slug }}
      - name: Does the stack need a (re)build?
        id: need
        run: |
          python3 - "course_data/perception/work/${{ matrix.slug }}" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os, sys
          d = sys.argv[1]
          ok = os.path.exists(os.path.join(d, "stack.npz")) and os.path.exists(os.path.join(d, "meta.json"))
          if ok:
              ok = (json.load(open(os.path.join(d, "meta.json"))).get("coverage") or {}).get("naip", 1.0) >= 0.9
          print("build=" + ("false" if ok else "true"))
          EOF
      - name: Cache Hugging Face weights
        if: steps.need.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/hf_cache
          key: hf-golfseg-v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q requests numpy scipy shapely pyproj rasterio affine pystac-client planetary-computer \
                      scikit-image scikit-learn==1.9.1 networkx
      - name: Install U-Net dependencies
        if: steps.need.outputs.build == 'true'
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q "huggingface_hub>=0.24" safetensors segmentation-models-pytorch timm
      - uses: mamba-org/setup-micromamba@v2
        if: steps.need.outputs.build == 'true'
        with:
          environment-name: pdal
          create-args: pdal
          init-shell: none
          cache-environment: true
      - name: Build / patch stack ${{ matrix.slug }}
        if: (steps.cache.outputs.cache-hit != 'true' || steps.need.outputs.build == 'true') && matrix.slug != 'none'
        timeout-minutes: 50
        run: |
          export PDAL_BIN="${MAMBA_ROOT_PREFIX:-/nonexistent}/envs/pdal/bin/pdal"
          python -u course_data/perception/fetch_stack.py ${{ matrix.slug }} || echo "stack failed"
          rm -rf course_data/perception/work/${{ matrix.slug }}/raw
          ls -la course_data/perception/work/${{ matrix.slug }} || true
      - name: Save stack cache
        if: (steps.cache.outputs.cache-hit != 'true' || steps.need.outputs.build == 'true') && hashFiles(format('course_data/perception/work/{0}/stack.npz', matrix.slug)) != ''
        uses: actions/cache/save@v4
        with:
          path: course_data/perception/work/${{ matrix.slug }}
          key: perc-stack-v2-${{ matrix.slug }}
      - name: Dev crop
        if: contains(needs.plan.outputs.dev, matrix.slug)
        run: |
          python -u -c "import sys; sys.path.insert(0, 'course_data/perception'); import fetch_stack as F; \
            F.dev_crop('course_data/perception/work/${{ matrix.slug }}', 'out/dev/${{ matrix.slug }}', 700)" || echo "crop failed"
      - name: Perceive + evaluate ${{ matrix.slug }}
        if: needs.plan.outputs.stage == 'all' && hashFiles(format('course_data/perception/work/{0}/stack.npz', matrix.slug)) != ''
        timeout-minutes: 30
        run: |
          python -u course_data/perception/perceive.py course_data/perception/work/${{ matrix.slug }} \
            --out out/scenes/${{ matrix.slug }} --tables out/tables/${{ matrix.slug }} || echo "perceive failed"
      - name: Stack meta
        if: always()
        run: |
          mkdir -p out/meta
          cp course_data/perception/work/${{ matrix.slug }}/meta.json out/meta/${{ matrix.slug }}.json 2>/dev/null || true
          find out -type f | head -50; du -sh out || true
      - uses: actions/upload-artifact@v4
        if: always() && matrix.slug != 'none' && hashFiles(format('course_data/perception/work/{0}/stack.npz', matrix.slug)) != ''
        with:
          name: stack-${{ matrix.slug }}
          path: course_data/perception/work/${{ matrix.slug }}
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always() && matrix.slug != 'none'
        with:
          name: perc-${{ matrix.slug }}
          path: out
          if-no-files-found: warn
          retention-days: 7

  report:
    needs: [plan, course]
    if: always() && needs.plan.outputs.slugs != '["none"]' && needs.plan.outputs.stage != 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Pull latest
        run: git pull -q --rebase origin "${{ github.ref_name }}" || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy scipy shapely pyproj scikit-learn==1.9.1 scikit-image networkx matplotlib pytest
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/perc
          pattern: perc-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: /home/runner/stacks
          pattern: stack-*
      - name: Combined stacks cache (for stage fast)
        run: |
          cd /home/runner/stacks && for d in stack-*; do [ -d "$d" ] && mv "$d" "${d#stack-}"; done; ls | wc -l; du -sh .
      - uses: actions/cache/save@v4
        with:
          path: /home/runner/stacks
          key: perc-stacks-all-${{ github.run_id }}
      - name: Gather
        run: |
          mkdir -p course_data/perception/stacks_meta
          cp /tmp/perc/meta/*.json course_data/perception/stacks_meta/ 2>/dev/null || true
          if [ -d /tmp/perc/dev ]; then mkdir -p course_data/perception/dev; cp -r /tmp/perc/dev/* course_data/perception/dev/; fi
          if [ -d /tmp/perc/scenes ]; then mkdir -p course_data/perception/scenes; cp -r /tmp/perc/scenes/* course_data/perception/scenes/; fi
          ls /tmp/perc; du -sh /tmp/perc/* || true
      - name: Unit tests
        run: python -m pytest -q course_data/perception || true
      - name: Train + report
        if: needs.plan.outputs.stage == 'all'
        run: |
          python -u course_data/perception/train.py --tables /tmp/perc/tables || echo "train failed"
          python -u course_data/perception/report.py --tables /tmp/perc/tables --scenes course_data/perception/scenes || echo "report failed"
          [ -f course_data/perception/REPORT.md ] && cat course_data/perception/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
          OMP_NUM_THREADS=1 python -u course_data/perception/route_check.py || echo "route check failed"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in course_data/perception/stacks_meta course_data/perception/dev course_data/perception/scenes \
                   course_data/perception/models course_data/perception/REPORT.md course_data/perception/eval.json \
                   course_data/perception/ROUTING.md course_data/perception/routing.json; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          printf '%s\n' "perception: ${{ needs.plan.outputs.stage }} (Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $i failed"; sleep $((i * 10))
          done
          exit 1

  fast:
    needs: plan
    if: needs.plan.outputs.stage == 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Pull latest
        run: git pull -q --rebase origin "${{ github.ref_name }}" || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy scipy shapely pyproj rasterio affine scikit-learn==1.9.1 scikit-image networkx matplotlib pytest
      - uses: actions/cache/restore@v4
        with:
          path: /home/runner/stacks
          key: perc-stacks-all-none
          restore-keys: perc-stacks-all-
      - name: Perceive every course (4 processes)
        env:
          OMP_NUM_THREADS: "1"
        run: |
          ls /home/runner/stacks | wc -l
          mkdir -p /tmp/perc/scenes /tmp/perc/tables /tmp/perc/logs
          ls /home/runner/stacks | xargs -P 4 -I{} sh -c \
            'python -u course_data/perception/perceive.py /home/runner/stacks/{} --out /tmp/perc/scenes/{} --tables /tmp/perc/tables/{} > /tmp/perc/logs/{}.txt 2>&1 || echo "perceive failed {}"'
          grep -l Traceback /tmp/perc/logs/*.txt | head; tail -3 $(grep -l Traceback /tmp/perc/logs/*.txt | head -2) 2>/dev/null || true
          rm -rf course_data/perception/scenes; mkdir -p course_data/perception/scenes; cp -r /tmp/perc/scenes/* course_data/perception/scenes/
      - name: Unit tests
        run: python -m pytest -q course_data/perception || true
      - name: Train + report
        env:
          OMP_NUM_THREADS: "4"
        run: |
          python -u course_data/perception/train.py --tables /tmp/perc/tables || echo "train failed"
          python -u course_data/perception/report.py --tables /tmp/perc/tables --scenes course_data/perception/scenes || echo "report failed"
          [ -f course_data/perception/REPORT.md ] && cat course_data/perception/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
          OMP_NUM_THREADS=1 python -u course_data/perception/route_check.py || echo "route check failed"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A course_data/perception/scenes
          for f in course_data/perception/models course_data/perception/REPORT.md course_data/perception/eval.json \
                   course_data/perception/ROUTING.md course_data/perception/routing.json; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          printf '%s\n' "perception: fast pass (Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $i failed"; sleep $((i * 10))
          done
          exit 1
