name: plan-spirit-hollow

# Spirit Hollow decisions in parallel: the Bayesian final decision one job per tee hole, and the wind
# grids one job per (tee offset, half of the holes). A merge job writes the files the book and the
# wind page read and commits them. Trigger: push a change to course_data/requests/plan_spirit_hollow.json.
on:
  push:
    paths:
      - "course_data/requests/plan_spirit_hollow.json"

permissions:
  contents: write

concurrency:
  group: plan-spirit-hollow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        hole: ["1", "2B", "2F", "4", "5", "6", "8", "9B", "9F", "10", "11", "13", "14", "16", "17", "18"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy matplotlib pillow
      - name: Final decision, hole ${{ matrix.hole }}
        env:
          FINAL_DRAWS: "64"
          FINAL_HOLES: ${{ matrix.hole }}
          FINAL_OUT: parts/final_${{ matrix.hole }}.json
        run: mkdir -p parts && python spirit_hollow/final_decision.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-${{ matrix.hole }}
          path: parts/

  wind:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        back: [0, -100, -80, -60, -40, -20, 20, 40, 60, 80]
        group: ["1,2B,2F,4,5,6,8,9B", "9F,10,11,13,14,16,17,18"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy matplotlib pillow
      - name: Wind grid, tee ${{ matrix.back }} yds back, holes ${{ matrix.group }}
        env:
          TEE_BACK: ${{ matrix.back }}
          WIND_HOLES: ${{ matrix.group }}
          WIND_OUT: parts/wind_${{ matrix.back }}_${{ strategy.job-index }}.json
        run: mkdir -p parts && python spirit_hollow/wind_grid.py
      - uses: actions/upload-artifact@v4
        with:
          name: wind-${{ strategy.job-index }}
          path: parts/

  merge:
    needs: [final, wind]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy matplotlib pillow
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/parts
      - name: Merge
        run: python spirit_hollow/merge_parts.py /tmp/parts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f spirit_hollow/output/final_decision.json spirit_hollow/output/final_decision.md spirit_hollow/output/wind_grid*.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          printf '%s\n' \
            "Spirit Hollow decisions + wind grids (GitHub Actions run ${{ github.run_id }})" \
            "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
