name: course-page

# One request, one page: any US course -> a checked wind and club-pick page (course_data/library/README.md).
# Trigger: push course_data/requests/course_page_<slug>.json (one course) or course_batch_<name>.json
#   {"requests": [paths], "rev": n} (rebuild the listed courses). Jobs:
#   plan     request files changed by the push -> course matrix + compute matrix (2 bases x wind / decide);
#            hand-checked targets (config "hand_checked": true, tournament slugs) are skipped, never overwritten
#   package  resolve + OSM + card + NAIP + 3DEP (platform/package.py run), vision layer (fetch_any, v2_fetch,
#            v2_model --infer --integrate), OB evidence (ob/fetch.py), package rebuild, bases + weather
#            (forecast or climate normals), sharpest leaf-on NAIP for the hole pictures, v2_course prepare
#   compute  per base: wind grids (all offsets of that base) / calm-day Bayesian decide
#   (package / compute / finish run per course in course_page_one.yml, up to 20 courses at a time)
#   finish   merge, page (data gzip-inlined), picture checks + qa_page.js, qa_report.md + status.json, commit
#            course_data/library/<slug>/ (gate builds: course_data/library/gate/<slug>/)
#   index    course_data/library/index.json
on:
  push:
    paths:
      - "course_data/requests/course_page_*.json"
      - "course_data/requests/course_batch_*.json"

permissions:
  contents: write

# No branch-wide concurrency group: each push runs on its own (a shared group allowed one pending run, so a third
# push cancelled the second). Runs only share the account's 20-job limit; finish / index commits rebase and retry.
concurrency:
  group: course-page-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONWARNINGS: ignore

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      courses: ${{ steps.p.outputs.courses }}
      compute: ${{ steps.p.outputs.compute }}
      n: ${{ steps.p.outputs.n }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50
      - id: p
        run: |
          B="${{ github.event.before }}"
          if [ -n "$B" ] && git cat-file -e "$B^{commit}" 2>/dev/null; then
            git diff --name-only "$B" "${{ github.sha }}" -- 'course_data/requests/course_page_*.json' 'course_data/requests/course_batch_*.json' > /tmp/reqs.txt
          else
            git diff --name-only HEAD~1 HEAD -- 'course_data/requests/course_page_*.json' 'course_data/requests/course_batch_*.json' > /tmp/reqs.txt
          fi
          cat /tmp/reqs.txt
          python3 course_data/library/course_page.py plan $(cat /tmp/reqs.txt) > /tmp/plan.json
          cat /tmp/plan.json
          # one matrix row per course, carrying its own compute cells (course_page_one.yml)
          echo "courses=$(python3 -c 'import json;p=json.load(open("/tmp/plan.json"));print(json.dumps([dict(c, compute=[x for x in p["compute"] if x["slug"] == c["slug"]]) for c in p["courses"]]))')" >> "$GITHUB_OUTPUT"
          echo "compute=$(python3 -c 'import json;print(json.dumps(json.load(open("/tmp/plan.json"))["compute"]))')" >> "$GITHUB_OUTPUT"
          echo "n=$(python3 -c 'import json;print(len(json.load(open("/tmp/plan.json"))["courses"]))')" >> "$GITHUB_OUTPUT"

  course:
    needs: plan
    if: needs.plan.outputs.n != '0'
    strategy:
      fail-fast: false
      # GitHub runs at most 20 jobs at once for this account (free plan, public repo): extra jobs queue there.
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.plan.outputs.courses) }}
    uses: ./.github/workflows/course_page_one.yml
    with:
      req: ${{ matrix.req }}
      slug: ${{ matrix.slug }}
      compute: ${{ toJSON(matrix.compute) }}

  index:
    needs: [plan, course]
    if: always() && needs.plan.outputs.n != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Library index
        run: |
          git pull --rebase origin "${{ github.ref_name }}" || true
          python3 course_data/library/course_page.py index
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/library/index.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          printf '%s\n' "course-page: library index (GitHub Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
