name: zero_tap_seqbench

# Zero-tap workstream C on workstream D's benchmark (course_data/zero_tap/BENCH.md), method `sequence`.
# Request-file trigger: commit course_data/requests/zt_seqbench_<tag>.json  {"tiers": "osm_card,nocard"}
# zsolve: run_bench.py solve (6 shards, committed anchors_params.json)
# zgate:  run_bench.py gate (fit on dev only) -> course_data/zero_tap/results/sequence/<tier>/<slug>.json
#         + course_data/zero_tap/sequence/results/<tag>/bench_d.{json,md}, zrows.json.gz; commit

on:
  push:
    paths:
      - "course_data/requests/zt_seqbench_*.json"

permissions:
  contents: write

concurrency:
  group: zt-seqbench-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      tiers: ${{ steps.p.outputs.tiers }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 20
      - id: p
        run: |
          BEFORE="${{ github.event.before }}"
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'course_data/requests/zt_seqbench_*.json' > /tmp/req.txt
          else
            ls course_data/requests/zt_seqbench_*.json > /tmp/req.txt
          fi
          python - <<'EOF'
          import json, os
          reqs = [l.strip() for l in open("/tmp/req.txt") if l.strip() and os.path.exists(l.strip())]
          p = sorted(reqs)[-1] if reqs else None
          r = json.load(open(p)) if p else {}
          out = dict(tag=os.path.basename(p)[len("zt_seqbench_"):-5] if p else "default",
                     tiers=r.get("tiers", "osm_card,nocard"))
          print(out)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, v in out.items():
                  fh.write(f"{k}={v}\n")
          EOF

  zsolve:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy scipy shapely scikit-image
      - run: |
          python -u course_data/zero_tap/sequence/run_bench.py solve --tiers ${{ needs.plan.outputs.tiers }} \
            --shard ${{ matrix.shard }}/6 --out zrows/zb_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: zrows-${{ matrix.shard }}
          path: zrows/

  zgate:
    needs: [plan, zsolve]
    if: always() && needs.zsolve.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy scipy shapely scikit-image
      - uses: actions/download-artifact@v4
        with:
          pattern: zrows-*
          merge-multiple: true
          path: zrows
      - name: Gate + write results
        run: |
          git pull -q --rebase origin "${{ github.ref_name }}" || true
          R=course_data/zero_tap/sequence/results/${{ needs.plan.outputs.tag }}
          mkdir -p $R
          python - <<'EOF'
          import glob, gzip, json
          rows = [r for p in sorted(glob.glob("zrows/zb_*.json")) for r in json.load(open(p))]
          with gzip.open("zrows.json.gz", "wt") as fh:
              json.dump(rows, fh)
          EOF
          mv zrows.json.gz $R/zrows.json.gz
          rm -rf course_data/zero_tap/results/sequence
          python -u course_data/zero_tap/sequence/run_bench.py gate $R/zrows.json.gz --tag ${{ needs.plan.outputs.tag }}
          cp course_data/zero_tap/sequence/gate_params_bench.json $R/
          cat $R/bench_d.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/zero_tap/sequence/results course_data/zero_tap/sequence/gate_params_bench.json course_data/zero_tap/results/sequence
          git diff --cached --quiet && exit 0
          printf '%s\n' "zero_tap sequence on the D benchmark (${{ needs.plan.outputs.tag }}, Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $i failed"; sleep $((i * 10))
          done
          exit 1
