name: zero_tap_sequence

# Zero-tap workstream C (course_data/zero_tap/sequence/): anchors fit, joint-solver bench, certainty gate.
# Request-file trigger: commit course_data/requests/zt_sequence_<name>.json
#   {"fit": true, "splits": "dev,valtest,heldout", "modes": "struct,struct_card,oracle,oracle_card,struct_v1,..."}
# fit:    fit_anchors.py club + nine (dev only) -> anchors_params.json
# bench:  bench.py, 6 shards (max 6 parallel), each -j 4
# report: combine rows -> results/rows.json.gz + bench.md; gate.py fit (dev rows) + eval -> gate_params.json,
#         results/gate_eval.{json,md}; commit
# {"stage": "zbench", "tiers": "osm_card,nocard"}: workstream D's benchmark (course_data/zero_tap/BENCH.md) with the
#         committed anchors_params.json: run_bench.py solve (6 shards) -> run_bench.py gate (fit on dev only) ->
#         course_data/zero_tap/results/sequence/<tier>/ + sequence/results/<tag>/bench_d.{json,md}; commit

on:
  push:
    paths:
      - "course_data/requests/zt_sequence_*.json"

permissions:
  contents: write

concurrency:
  group: zt-sequence-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      fit: ${{ steps.p.outputs.fit }}
      splits: ${{ steps.p.outputs.splits }}
      modes: ${{ steps.p.outputs.modes }}
      tag: ${{ steps.p.outputs.tag }}
      stage: ${{ steps.p.outputs.stage }}
      tiers: ${{ steps.p.outputs.tiers }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 20
      - id: p
        run: |
          BEFORE="${{ github.event.before }}"
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'course_data/requests/zt_sequence_*.json' > /tmp/req.txt
          else
            ls course_data/requests/zt_sequence_*.json > /tmp/req.txt
          fi
          python - <<'EOF'
          import json, os
          reqs = [l.strip() for l in open("/tmp/req.txt") if l.strip() and os.path.exists(l.strip())]
          p = sorted(reqs)[-1] if reqs else None
          r = json.load(open(p)) if p else {}
          out = dict(fit="true" if r.get("fit", True) else "false", splits=r.get("splits", "dev,valtest,heldout"),
                     modes=r.get("modes", "struct,struct_card,oracle,oracle_card,struct_v1,struct_card_v1,oracle_v1"),
                     tag=os.path.basename(p)[len("zt_sequence_"):-5] if p else "default",
                     stage=r.get("stage", "seq"), tiers=r.get("tiers", "osm_card,nocard"))
          print(out)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, v in out.items():
                  fh.write(f"{k}={v}\n")
          EOF

  fit:
    needs: plan
    if: needs.plan.outputs.fit == 'true' && needs.plan.outputs.stage == 'seq'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy scipy shapely scikit-image
      - run: |
          rm -f course_data/zero_tap/sequence/anchors_params.json
          python -u course_data/zero_tap/sequence/fit_anchors.py club | tee fit_log.txt
          python -u course_data/zero_tap/sequence/fit_anchors.py nine -j 4 | tee -a fit_log.txt
          cp fit_log.txt course_data/zero_tap/sequence/
      - uses: actions/upload-artifact@v4
        with:
          name: anchors
          path: |
            course_data/zero_tap/sequence/anchors_params.json
            course_data/zero_tap/sequence/fit_log.txt

  bench:
    needs: [plan, fit]
    if: always() && needs.plan.result == 'success' && needs.fit.result != 'failure' && needs.plan.outputs.stage == 'seq'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy scipy shapely scikit-image
      - uses: actions/download-artifact@v4
        if: needs.fit.result == 'success'
        with:
          name: anchors
          path: course_data/zero_tap/sequence
      - run: |
          python -u course_data/zero_tap/sequence/bench.py --split ${{ needs.plan.outputs.splits }} \
            --modes ${{ needs.plan.outputs.modes }} --shard ${{ matrix.shard }} --of 6 -j 4 \
            --out rows/rows_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: rows-${{ matrix.shard }}
          path: rows/

  report:
    needs: [plan, fit, bench]
    if: always() && needs.bench.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy scipy shapely scikit-image
      - uses: actions/download-artifact@v4
        if: needs.fit.result == 'success'
        with:
          name: anchors
          path: course_data/zero_tap/sequence
      - uses: actions/download-artifact@v4
        with:
          pattern: rows-*
          merge-multiple: true
          path: rows
      - name: Combine, gate
        run: |
          R=course_data/zero_tap/sequence/results/${{ needs.plan.outputs.tag }}
          python -u course_data/zero_tap/sequence/bench.py --combine rows/rows_*.json --out $R
          python -u course_data/zero_tap/sequence/gate.py fit $R/rows.json.gz | tee $R/gate_fit.txt
          python -u course_data/zero_tap/sequence/gate.py eval $R/rows.json.gz --out $R
          cp course_data/zero_tap/sequence/gate_params.json $R/ || true
          cp course_data/zero_tap/sequence/fit_log.txt $R/ || true
          cat $R/bench.md $R/gate_eval.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/zero_tap/sequence/results course_data/zero_tap/sequence/gate_params.json
          git add course_data/zero_tap/sequence/anchors_params.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          printf '%s\n' "zero_tap sequence: bench + gate (${{ needs.plan.outputs.tag }}, Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $i failed"; sleep $((i * 10))
          done
          exit 1
