name: nccga-package

# Fast path for the NCCGA tournament courses: fetch + build ONLY the listed package requests, one job per course
# (course-package.yml rebuilds every package on any platform change and serialises all runs).
# Trigger: push course_data/requests/nccga_pkg.json  {"requests": ["course_data/requests/package_<slug>.json", ...],
#   "rev": n}. Each job runs platform/package.py run <request> and commits course_data/packages/<slug>/ only.
on:
  push:
    paths:
      - "course_data/requests/nccga_pkg.json"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      reqs: ${{ steps.p.outputs.reqs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: p
        run: echo "reqs=$(python3 -c 'import json;print(json.dumps(json.load(open("course_data/requests/nccga_pkg.json"))["requests"]))')" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        req: ${{ fromJson(needs.plan.outputs.reqs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy shapely pyproj matplotlib pillow pytest opencv-python-headless scikit-learn scikit-image \
                      pystac-client planetary-computer rasterio
      - name: Fetch + build
        run: |
          python course_data/platform/package.py run ${{ matrix.req }} || echo "build failed"
          S=$(python3 -c "import sys;sys.path.insert(0,'course_data/platform');import fetch_package as fp,json;r='${{ matrix.req }}';print(fp.request_slug(json.load(open(r)),r))")
          echo "SLUG=$S" >> "$GITHUB_ENV"
          ls -la course_data/packages/$S || true
          head -40 course_data/packages/$S/qa.md || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/packages/$SLUG
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          printf '%s\n' "NCCGA package $SLUG (GitHub Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5 6 7 8; do
            if git pull --rebase -X theirs origin "${{ github.ref_name }}"; then
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i * 10))
          done
          exit 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ strategy.job-index }}
          path: course_data/packages/
          retention-days: 5
