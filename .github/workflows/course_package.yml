name: course-package

# Request-file pattern (ARCHITECTURE.md 9.4): commit course_data/requests/package_<slug>.json
#   {"schema": "request/1", "kind": "package", "course": "Mozingo Lake", "state": "MO", "tees": "White",
#    "town" / "near" / "osm": "way/123" (disambiguation, optional), "yardages": [..], "pars": [..],
#    "scorecard": "<repo path>", "imagery_dir": "<repo path>", "render": false (all optional)}
# and this workflow resolves the course in OSM, fetches OSM + scorecards + NAIP + 3DEP, builds
# course_data/packages/<slug>/ (package.json, course_auto.py, qa.md) and commits it back.
# A fetched course without the product vision layer (vision_any/2 trees + water, OB evidence) gets it built by
# course_data/vision_any/build_layers.py - the same step and tools (.github/actions/vision-layers) as the library
# build, course_page_one.yml - and is rebuilt with it; the layer (vision_any/<slug>/raw, vision_any.geojson, ...)
# and course_data/ob/<slug> are committed with the package. A fetched package that still has no vision_any/2
# layer FAILS the run (after the commit); offline rebuilds without one get a warning and a CHECK vision stage.
# Changing only platform code rebuilds every fetched package offline.
#
# Jobs (so new requests never starve behind the offline rebuild and a job cap never loses all the work):
#   plan     unit tests; which requests to build (changed by this push, or since the last committed run's
#            "Built from: <sha>", or never fetched) and how many packages have a stale build hash
#            (run_requests.py --plan-json; packages/<slug>/build_inputs.json)
#   request  one matrix job per request (max 4 at a time): fetch + vision layer + build, its own commit
#            ("Built from: <plan sha>"), its own Spirit Hollow golden and vision layer gate
#   rebuild  after the requests: 2 shards (crc32(slug) % 2) rebuild the STALE fetched packages offline and
#            commit every 4 packages (commit_run.sh -> commit_packages.sh; _index.json is merged), so a cancelled
#            run's finished packages are kept and the next run only does the rest

on:
  push:
    paths:
      - ".github/workflows/course_package.yml"
      - "course_data/platform/**"
      - "course_data/requests/package_*.json"
      - "course_data/requests/survey_*.json"
      - "course_data/vision_any/gapfill.py"
      - "course_data/segment/gapfill.py"
      - "course_data/geometry/build_holes.py"
      - "course_data/tees/place_tee.py"
      - "course_data/tees/lidar_pads.py"
      - "course_data/pipeline.py"
      - "course_data/elevation/adjust.py"
      - "course_data/ob/infer.py"
      - "course_data/ob/params.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: course-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      requests: ${{ steps.plan.outputs.requests }}
      rebuild: ${{ steps.plan.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 300

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get install -y -q poppler-utils >/dev/null || true
          python -m pip install --upgrade pip
          pip install requests numpy scipy shapely pyproj matplotlib pillow pytest opencv-python-headless scikit-learn scikit-image \
                      pystac-client planetary-computer rasterio

      # lightgbm + PDAL (tools only), as the build jobs have them, for the tests that use them
      - uses: ./.github/actions/vision-layers

      - name: Unit tests (offline)
        run: python -m pytest -q course_data/platform

      - name: Changed files
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git ls-files course_data/platform course_data/requests .github/workflows/course_package.yml > /tmp/changed.txt
          else
            git diff --name-only "$BEFORE" "${{ github.sha }}" > /tmp/changed.txt
          fi
          # A newer push cancels a PENDING run of this group (GitHub keeps one pending run), so a request pushed
          # just before would be lost. Also take every request changed since the commit the last committed run
          # checked out ("Built from: <sha>" in its message; else the parent of the last package commit).
          # Only request-job commits carry "Built from:"; rebuild commits say "Rebuilt at:".
          M=$(git log -n 1 --grep='^Built from: ' --format=%B | sed -n 's/^Built from: //p' | head -1)
          [ -n "$M" ] || M=$(git log -n 1 --grep='^Course packages from request files' --format=%H)^
          if git cat-file -e "$M^{commit}" 2>/dev/null; then
            git diff --name-only "$M" HEAD -- 'course_data/requests/package_*.json' >> /tmp/changed.txt
            sort -u -o /tmp/changed.txt /tmp/changed.txt
          fi
          cat /tmp/changed.txt

      - name: Plan
        id: plan
        run: |
          python course_data/platform/run_requests.py --plan-json /tmp/plan.json $(cat /tmp/changed.txt)
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "requests=$(python -c 'import json; print(json.dumps(json.load(open("/tmp/plan.json"))["requests"]))')"
            echo "rebuild=$(python -c 'import json; print(json.load(open("/tmp/plan.json"))["rebuild"])')"
          } >> "$GITHUB_OUTPUT"
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          p = json.load(open("/tmp/plan.json"))
          print("## Plan\n\nRequests (one job each): " + (", ".join(p["requests"]) or "none")
                + f"\n\nStale packages for the offline rebuild: {p['rebuild']}\n")
          PY

  # New / changed requests FIRST, one job (and one commit) each.
  request:
    needs: plan
    if: needs.plan.outputs.requests != '[]' && needs.plan.outputs.requests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        request: ${{ fromJSON(needs.plan.outputs.requests) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 300

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get install -y -q poppler-utils >/dev/null || true
          python -m pip install --upgrade pip
          pip install requests numpy scipy shapely pyproj matplotlib pillow pytest opencv-python-headless scikit-learn scikit-image \
                      pystac-client planetary-computer rasterio

      # lightgbm + PDAL for the vision layer (slugs empty: tools only; run_requests.py --vision runs the layer)
      - uses: ./.github/actions/vision-layers

      - name: Keep the Spirit Hollow package as built before this run (golden before/after)
        run: |
          mkdir -p /tmp/before_spirit_hollow
          cp course_data/packages/spirit_hollow/package.json /tmp/before_spirit_hollow/package.json || true

      - name: Build the request
        continue-on-error: true
        env:
          PYTHONWARNINGS: ignore
          VISION_GATE: /tmp/vision_gate.txt
        run: python course_data/platform/run_requests.py --vision --phase requests --only "${{ matrix.request }}" "${{ matrix.request }}"

      # Spirit Hollow golden for the tee stage (qa/golden_spirit_hollow.py, Q1 per-screenshot tee sets), before
      # vs after this build, each scored with the package's own set and with the screenshot's set per hole.
      # Writes course_data/qa/golden_tees.{json,md} only (REPORT.md stays QA's).
      - name: Spirit Hollow golden (tee stage, before / after)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          if [ -f /tmp/before_spirit_hollow/package.json ] && \
             ! cmp -s /tmp/before_spirit_hollow/package.json course_data/packages/spirit_hollow/package.json; then
            python course_data/qa/golden_spirit_hollow.py --no-oracle --tee-set both --out golden_tees \
              --package /tmp/before_spirit_hollow/package.json --package course_data/packages/spirit_hollow/package.json
          else
            echo "Spirit Hollow package unchanged: no golden run"
          fi

      - name: Commit the package
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' \
            "Course packages from request files (GitHub Actions run ${{ github.run_id }}: $(basename '${{ matrix.request }}' .json))" \
            "" \
            "Built from: ${{ needs.plan.outputs.sha }}" \
            "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          # never clobber newer work: a package directory (or golden file) that changed on origin since this
          # job's checkout is skipped, not overwritten; _index.json is merged; the commit is built on the
          # current origin tip (commit_packages.sh), re-checked on every rejected push
          bash course_data/platform/commit_run.sh "${{ github.ref_name }}" "${{ needs.plan.outputs.sha }}" /tmp/msg.txt

      # loud, after the commit: a fetched package without the product tree layer fails the job
      - name: Vision layer gate
        if: always()
        run: |
          [ -s /tmp/vision_gate.txt ] || { echo "every package built this job has the vision_any/2 layer"; exit 0; }
          bad=0
          while IFS=$'\t' read -r level slug why; do
            echo "::$level title=vision layer missing ($slug)::$why"
            [ "$level" = error ] && bad=1
          done < /tmp/vision_gate.txt
          exit $bad

      - name: Keep the built packages if the commit failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.run_id }}-request-${{ strategy.job-index }}
          path: course_data/packages/
          retention-days: 5

  # Then the offline rebuild of the fetched packages whose build hash is stale, sharded, committed per chunk.
  rebuild:
    needs: [plan, request]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.rebuild != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      SHARDS: 2
      COMMIT_EVERY: 4
    steps:
      # the branch tip: it has the packages the request jobs just committed (current build hash: skipped)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 300

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get install -y -q poppler-utils >/dev/null || true
          python -m pip install --upgrade pip
          pip install requests numpy scipy shapely pyproj matplotlib pillow pytest opencv-python-headless scikit-learn scikit-image \
                      pystac-client planetary-computer rasterio

      - uses: ./.github/actions/vision-layers

      - name: Keep the Spirit Hollow package as built before this run (golden before/after)
        run: |
          mkdir -p /tmp/before_spirit_hollow
          cp course_data/packages/spirit_hollow/package.json /tmp/before_spirit_hollow/package.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' \
            "Offline package rebuild (GitHub Actions run ${{ github.run_id }}, shard ${{ matrix.shard }}/$SHARDS)" \
            "" \
            "Rebuilt at: $(git rev-parse HEAD)" \
            "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # every COMMIT_EVERY packages: commit_run.sh <slugs> (packages + merged _index.json)
      - name: Rebuild stale packages (offline)
        continue-on-error: true
        env:
          PYTHONWARNINGS: ignore
          VISION_GATE: /tmp/vision_gate.txt
          REQS: ${{ needs.plan.outputs.requests }}
        run: |
          export COMMIT_CMD="bash course_data/platform/commit_run.sh ${{ github.ref_name }} $BASE_SHA /tmp/msg.txt"
          python course_data/platform/run_requests.py --phase rebuild --shard "${{ matrix.shard }}/$SHARDS" \
            --commit-every "$COMMIT_EVERY" $(python -c 'import json, os; print(" ".join(json.loads(os.environ["REQS"] or "[]")))')

      - name: Spirit Hollow golden (tee stage, before / after)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          if [ -f /tmp/before_spirit_hollow/package.json ] && \
             ! cmp -s /tmp/before_spirit_hollow/package.json course_data/packages/spirit_hollow/package.json; then
            python course_data/qa/golden_spirit_hollow.py --no-oracle --tee-set both --out golden_tees \
              --package /tmp/before_spirit_hollow/package.json --package course_data/packages/spirit_hollow/package.json
          else
            echo "Spirit Hollow package unchanged: no golden run"
          fi

      # whatever the per-chunk commits left (the golden files, a chunk whose commit failed)
      - name: Commit the rest
        if: always()
        run: bash course_data/platform/commit_run.sh "${{ github.ref_name }}" "$BASE_SHA" /tmp/msg.txt

      - name: Vision layer gate
        if: always()
        run: |
          [ -s /tmp/vision_gate.txt ] || { echo "every package rebuilt this job has the vision_any/2 layer"; exit 0; }
          bad=0
          while IFS=$'\t' read -r level slug why; do
            echo "::$level title=vision layer missing ($slug)::$why"
            [ "$level" = error ] && bad=1
          done < /tmp/vision_gate.txt
          exit $bad

      - name: Keep the built packages if the commit failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.run_id }}-rebuild-${{ matrix.shard }}
          path: course_data/packages/
          retention-days: 5
