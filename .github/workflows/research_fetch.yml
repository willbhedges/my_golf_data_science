name: research-fetch

# Research probe of free, key-less course-data sources (OpenGolfAPI, OSM taginfo, Overpass).
# See course_data/research/auto_course_lookup.md section 6. No secrets are used.

on:
  push:
    paths:
      - ".github/workflows/research_fetch.yml"
      - "course_data/research/open_sources.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe open sources
        run: python course_data/research/open_sources.py fetch

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/research/raw course_data/research/probe.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"; exit 0
          fi
          printf '%s\n' \
            "Add open-source course data probe results (GitHub Actions run ${{ github.run_id }})" \
            "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
