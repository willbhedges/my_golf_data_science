name: elevation-fetch

on:
  push:
    paths:
      - ".github/workflows/elevation_fetch.yml"
      - "course_data/elevation/fetch_dem.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elevation-fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests rasterio pystac-client planetary-computer

      - name: Fetch DEM
        run: python course_data/elevation/fetch_dem.py --course-dir course_data/spirit_hollow --margin 200 --out course_data/elevation/spirit_hollow

      - name: Commit DEM
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/elevation/spirit_hollow/dem.tif course_data/elevation/spirit_hollow/dem.npz course_data/elevation/spirit_hollow/georef.json
          if git diff --cached --quiet; then
            echo "No DEM changes to commit"; exit 0
          fi
          printf '%s\n' \
            "Add USGS 3DEP DEM for Spirit Hollow (GitHub Actions run ${{ github.run_id }})" \
            "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
