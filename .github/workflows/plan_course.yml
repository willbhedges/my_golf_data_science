name: plan-course

# Course package -> strategy book PDF + aim sheets + wind caddie page (course_data/product/plan.py).
# Trigger: commit a request file, e.g. course_data/product/requests/spirit_hollow.json
#   {"package": "course_data/packages/spirit_hollow/package.json", "tees": "Black", "mode": "quick"}
# (ARCHITECTURE.md 9.4's course_data/requests/plan_<state>_<slug>.json works too.)
# Outputs are committed back to the branch under the plan's out dir (default course_data/packages/<slug>/out/).

on:
  push:
    paths:
      - "course_data/product/requests/*.json"
      - "course_data/requests/plan_*.json"
  workflow_dispatch:
    inputs:
      request:
        description: "Request file path(s), space separated (default: every request file)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: plan-course-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pillow opencv-python-headless rasterio pyproj shapely requests

      - name: Pick the request files
        id: req
        env:
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ github.event.inputs.request }}
        run: |
          if [ -n "$INPUT" ]; then
            files="$INPUT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- \
                    'course_data/product/requests/*.json' 'course_data/requests/plan_*.json' | tr '\n' ' ')
          else
            files=$(ls course_data/product/requests/*.json course_data/requests/plan_*.json 2>/dev/null | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "requests: $files"

      - name: Run plan.py per request
        id: plan
        if: steps.req.outputs.files != ''
        run: python course_data/product/run_requests.py ${{ steps.req.outputs.files }}

      - name: Commit outputs
        if: always() && steps.plan.outputs.dirs != ''
        env:
          DIRS: ${{ steps.plan.outputs.dirs }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in $DIRS; do
            find "$d" -type f -size +50M -print -delete
            git add -- "$d"
          done
          if git diff --cached --quiet; then
            echo "No plan output changes to commit"; exit 0
          fi
          printf '%s\n' \
            "Add course plan outputs: $DIRS (GitHub Actions run ${{ github.run_id }})" \
            "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
