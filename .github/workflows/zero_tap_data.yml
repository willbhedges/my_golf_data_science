name: zero_tap_data

# Zero-tap benchmark data (course_data/zero_tap/fetch.py, workstream D).
# Request-file trigger: commit course_data/requests/ztbench_data_<name>.json
#   {"schema": "request/1", "kind": "ztbench_data", "stage": "all" | "survey" | "fetch",
#    "what": "osm,card" | "card" | "imagery", "source": "" | "zero_tap" | "structure", "slugs": [], "missing_only": true,
#    "states": [optional survey subset]}
# survey: one Overpass survey per new state (max 6 at a time) -> surveys/ -> select -> selection.json (committed)
# fetch:  6 chunks over selection.json (+ structure/sets.json for card / imagery) -> data/<slug>/ (committed)

on:
  push:
    paths:
      - "course_data/requests/ztbench_data_*.json"

permissions:
  contents: write

concurrency:
  group: ztbench-data-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  HF_HOME: /home/runner/hf_cache
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.p.outputs.stage }}
      states: ${{ steps.p.outputs.states }}
      args: ${{ steps.p.outputs.args }}
      what: ${{ steps.p.outputs.what }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 50
      - id: p
        run: |
          BEFORE="${{ github.event.before }}"
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'course_data/requests/ztbench_data_*.json' > /tmp/req.txt
          else
            ls course_data/requests/ztbench_data_*.json > /tmp/req.txt
          fi
          python - <<'EOF'
          import json, os, sys
          sys.path.insert(0, "course_data/zero_tap")
          import fetch as F
          reqs = [l.strip() for l in open("/tmp/req.txt") if l.strip() and os.path.exists(l.strip())]
          r = json.load(open(sorted(reqs)[-1])) if reqs else {"stage": "fetch"}
          args = []
          if r.get("missing_only"): args.append("--missing-only")
          if r.get("source"): args.append("--source " + r["source"])
          if r.get("slugs"): args.append("--slugs " + ",".join(r["slugs"]))
          out = dict(stage=r.get("stage", "all"), states=json.dumps(r.get("states") or F.split()["new_states"]),
                     args=" ".join(args), what=r.get("what", "osm,card"))
          print(out)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, v in out.items():
                  fh.write(f"{k}={v}\n")
          EOF

  survey:
    needs: plan
    if: needs.plan.outputs.stage == 'survey' || needs.plan.outputs.stage == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        state: ${{ fromJSON(needs.plan.outputs.states) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python -u course_data/zero_tap/fetch.py survey ${{ matrix.state }} --out survey/survey_${{ matrix.state }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: ztsurvey-${{ matrix.state }}
          path: survey/survey_${{ matrix.state }}.json

  select:
    needs: [plan, survey]
    if: always() && (needs.plan.outputs.stage == 'survey' || needs.plan.outputs.stage == 'all') && needs.survey.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: ztsurvey-*
          merge-multiple: true
          path: /tmp/surveys
      - name: Select + commit
        run: |
          mkdir -p course_data/zero_tap/surveys
          cp /tmp/surveys/*.json course_data/zero_tap/surveys/ || true
          python -u course_data/zero_tap/fetch.py select
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/zero_tap/surveys course_data/zero_tap/selection.json
          git diff --cached --quiet && exit 0
          printf '%s\n' "zero_tap: new-state surveys + benchmark selection (Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $i failed"; sleep $((i * 10))
          done
          exit 1

  fetch:
    needs: [plan, select]
    if: always() && (needs.plan.outputs.stage == 'fetch' || (needs.plan.outputs.stage == 'all' && needs.select.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        chunk: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Hugging Face weights
        if: contains(needs.plan.outputs.what, 'imagery')
        uses: actions/cache@v4
        with:
          path: /home/runner/hf_cache
          key: hf-golfseg-v1
      - name: Install (imagery)
        if: contains(needs.plan.outputs.what, 'imagery')
        run: |
          python -m pip install --upgrade pip -q
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q "huggingface_hub>=0.24" safetensors segmentation-models-pytorch timm \
                      requests numpy scipy shapely pyproj matplotlib pillow opencv-python-headless scikit-learn \
                      scikit-image pystac-client planetary-computer rasterio
      - name: Install
        if: "!contains(needs.plan.outputs.what, 'imagery')"
        run: pip install -q requests numpy shapely pyproj beautifulsoup4 lxml
      - name: Fetch chunk ${{ matrix.chunk }}
        run: |
          git pull -q --rebase origin "${{ github.ref_name }}" || true
          python -u course_data/zero_tap/fetch.py fetch --chunk ${{ matrix.chunk }} --of 6 --what ${{ needs.plan.outputs.what }} ${{ needs.plan.outputs.args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ztdata-${{ matrix.chunk }}
          path: course_data/zero_tap/data
          if-no-files-found: warn

  commit:
    needs: [plan, fetch]
    if: always() && needs.fetch.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ztdata-*
          merge-multiple: true
          path: /tmp/ztdata
      - name: Commit data
        run: |
          mkdir -p course_data/zero_tap/data
          cp -r /tmp/ztdata/. course_data/zero_tap/data/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_data/zero_tap/data
          git diff --cached --quiet && exit 0
          printf '%s\n' "zero_tap: benchmark course data, ${{ needs.plan.outputs.what }} (Actions run ${{ github.run_id }})" "" \
            "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_011rKvZuUcU769YfPfktPsds" > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $i failed"; sleep $((i * 10))
          done
          exit 1
